<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogiFlow · Prototype interactif</title><style>:root{font-family:Inter,system-ui,Arial;background:#f4f7fb;color:#172b43}*{box-sizing:border-box}body{margin:0}header{background:#102c46;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:23px}button,select,input{font:inherit}button{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;background:#e8eef5;color:#16314b}button.primary{background:#17b8a6;color:#062e32;font-weight:700}button:hover{filter:brightness(.95)}.layout{display:flex;min-height:calc(100vh - 68px)}nav{width:230px;background:#fff;border-right:1px solid #e0e6ee;padding:15px;flex-shrink:0}nav button{display:block;width:100%;text-align:left;background:transparent;margin-bottom:5px}nav button.active{background:#dff6f2;color:#07675c;font-weight:700}main{padding:25px;max-width:1200px;width:100%;margin:auto}.sub{color:#687a8e}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin:20px 0}.card,.panel{background:white;border:1px solid #e1e9f0;border-radius:14px;padding:18px;box-shadow:0 3px 13px #132c4208}.card strong{display:block;font-size:28px;margin:8px 0}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #edf0f3;padding:12px 0}.row:last-child{border:0}.tag{border-radius:30px;background:#e9f7f2;color:#11715f;padding:5px 10px;font-size:12px}.warn{background:#fff2dc;color:#9b5b00}.danger{background:#ffebeb;color:#a62e37}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input,select{padding:10px;border:1px solid #cbd7e2;border-radius:8px;max-width:100%}.map{height:270px;border-radius:12px;background:linear-gradient(125deg,#e0ece7,#eaf3e9);position:relative;overflow:hidden;border:1px solid #cddfd8}.road{position:absolute;height:12px;background:#fff;transform:rotate(-20deg);width:130%;top:40%;left:-10%;box-shadow:0 80px 0 #fff,0 -75px 0 #fff}.road.two{transform:rotate(53deg);top:45%;left:-15%}.pin{position:absolute;background:#173d59;color:white;border:3px solid white;border-radius:50%;width:33px;height:33px;display:grid;place-items:center;font-size:12px;font-weight:bold;box-shadow:0 3px 9px #0003}.timeline{border-left:3px solid #1ab7a6;margin:15px 0 15px 10px;padding-left:20px}.timeline div{padding:10px 0}.notice{background:#edf9f7;border-left:4px solid #1ab7a6;padding:12px;margin:15px 0;border-radius:5px}.tiny{font-size:12px;color:#6c7c8c}.progress{background:#dce6ec;border-radius:12px;height:11px;overflow:hidden}.progress div{background:#1ab7a6;height:100%}@media(max-width:750px){.layout{display:block}nav{position:fixed;bottom:0;left:0;right:0;width:100%;display:flex;overflow:visible;padding:7px 4px calc(7px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid #d9e4ed;z-index:40;box-shadow:0 -4px 20px #102c4615}nav button{flex:1;min-width:0;padding:10px 2px;font-size:11px;text-align:center;margin:0}main{padding:14px 14px 100px}.grid{grid-template-columns:1fr}header{padding:13px}header b{font-size:19px}}@media(max-width:750px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.home-tile{display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;padding:22px 16px;min-height:156px;border:1px solid #e1e9e9;border-radius:18px;background:#fff;color:#244052;white-space:normal}.home-tile b{font-size:18px}.home-tile small{font-size:13px;color:#667c88}.tile-icon{font-size:28px;color:#18a997}@media(max-width:370px){.home-grid{gap:9px}.home-tile{padding:16px 10px}.home-tile b{font-size:15px}}.fleet-tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 14px;margin-bottom:12px;scrollbar-width:thin}.fleet-tabs button{white-space:nowrap;flex-shrink:0;border-radius:24px}.fleet-tabs button.active{background:#dff6f2;color:#07675c;font-weight:700}.fleet-tabs+ .panel{margin-top:8px}.fleet-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.fleet-fields label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}.fleet-fields input,.fleet-fields select{width:100%;min-height:43px}.fleet-form .sub{font-weight:700;margin-top:18px}.fleet-photo-preview{display:block;width:128px;height:128px;object-fit:cover;border-radius:12px;margin-top:10px;border:1px solid #d9e4ed}.fleet-detail-photo{width:160px;height:160px;object-fit:cover;border-radius:14px;margin:12px 0}.fleet-detail-grid,.fleet-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.fleet-detail-field{padding:10px;border:1px solid #e1e9f0;border-radius:10px}.fleet-detail-field small,.fleet-detail-field b{display:block}.fleet-detail-field small{color:#687a8e;margin-bottom:6px}.fleet-list-card{display:flex;align-items:center;text-align:left;gap:12px;width:100%;padding:13px 10px;margin:8px 0;border:1px solid #e1e9f0;border-radius:14px;background:#fff;cursor:pointer;color:#173c59}.fleet-list-card:active{background:#edf8f5}.fleet-list-photo,.fleet-list-avatar{width:54px;height:54px;flex:none;border-radius:12px;object-fit:cover}.fleet-list-avatar{display:flex;align-items:center;justify-content:center;background:#edf2f7;font-size:24px}.fleet-list-info{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}.fleet-list-info b,.fleet-list-info small{overflow-wrap:anywhere}.fleet-list-info small{color:#607587}.fleet-list-arrow{font-size:28px}.fleet-danger{color:#a52727;border:1px solid #e4b3b3}.compliance-options{display:flex;flex-wrap:wrap;gap:20px;margin:16px 0}.compliance-options label{display:inline-flex;align-items:center;gap:8px;font-size:14px}.compliance-options input[type=checkbox]{width:20px;height:20px;min-height:0;margin:0}.compliance-doc-fields{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin:16px 0}.compliance-doc-fields label{display:flex;flex-direction:column;gap:7px;min-width:0}.compliance-doc-fields input,.compliance-doc-fields select{display:block;width:100%;max-width:100%;box-sizing:border-box;min-width:0}.compliance-doc-fields input[type=file]{font-size:14px;white-space:normal}.compliance-doc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.driver-vehicle-list{display:grid;gap:12px;margin:14px 0}.driver-vehicle-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px;border:2px solid #e1e7ed;background:#fff;border-radius:14px}.driver-vehicle-card.selected{border-color:#0b9e91;background:#e7f9f5}.driver-vehicle-card img,.driver-vehicle-placeholder{width:75px;height:70px;object-fit:cover;border-radius:10px;flex-shrink:0}.driver-vehicle-placeholder{display:grid;place-items:center;background:#eaf1f5;font-size:30px}.driver-vehicle-info{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}.driver-vehicle-info small{color:#637486}.driver-vehicle-warning{color:#9b5a1a!important}.driver-vehicle-ready{color:#137c68!important}.driver-vehicle-check{font-size:26px;color:#078c7d}.driver-status-banner{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:15px;margin:0 0 18px;border:1px solid #cdd6e1;background:#edf1f5;color:#24374b}.driver-status-banner.driver-online{background:#e2f7eb;border-color:#73caa0;color:#145a37}.driver-status-dot{width:13px;height:13px;border-radius:50%;background:#8796a6;flex-shrink:0}.driver-online .driver-status-dot{background:#168449;box-shadow:0 0 0 4px #c4ecd5}.driver-status-banner span:nth-child(2){display:flex;flex-direction:column;gap:3px;flex:1}.driver-status-banner small{font-size:12px}.driver-status-banner button{padding:9px 12px;font-size:13px}.offline-action{background:#b42332!important;color:white!important;border:1px solid #9f1c2c!important}.fleet-availability-card{display:flex;align-items:center;gap:12px;padding:15px 0;border-top:1px solid #e3e8ee}.fleet-availability-photo,.fleet-availability-avatar{width:66px;height:66px;object-fit:cover;border-radius:13px;flex-shrink:0}.fleet-availability-avatar{display:grid;place-items:center;background:#e9eff4;font-size:30px}.fleet-availability-info{display:flex;flex-direction:column;gap:5px;min-width:0}.fleet-availability-info small{line-height:1.45;color:#566476}.fleet-status-online{color:#147a46;font-weight:700}.fleet-status-offline{color:#667487;font-weight:700}</style></head><body><header><div><b>◈ LogiFlow</b> <small> · Kinshasa · DEMO</small></div><span style="font-size:11px;opacity:.85">v0.2.49</span><button onclick="toggleLang()" id="lang">EN</button></header><div class="layout"><nav id="nav"></nav><main id="app"></main></div><script>
let lang='fr',page='home',received=4,approved=false,loaded=false,tripStarted=false,stop=1,delivered=false,pinError='',collection=false;
let selectedShipment='LGF-2026-00125',parcelFocus=1,shipmentQuery='';
const shipmentData=[
{id:'LGF-2026-00125',sender:'Kinshasa Fashion · Jean Mbuyi',recipient:'Marie Kabeya',origin:'Gombe, Kinshasa',destination:'Limete, Kinshasa',count:5,status:'exception',codes:['SWC-78451','SWC-78452','SWC-78453','SWC-78454','SWC-78455']},
{id:'LGF-2026-00126',sender:'Marché Central · Chantal Ilunga',recipient:'Patrick Kalala',origin:'Gombe, Kinshasa',destination:'Matete, Kinshasa',count:2,status:'transit',codes:['SWC-78501','SWC-78502']},
{id:'LGF-2026-00127',sender:'Maison Kivu · David Tshibangu',recipient:'Sarah Luyindula',origin:'Ngaliema, Kinshasa',destination:'Lemba, Kinshasa',count:3,status:'delivered',codes:['SWC-78601','SWC-78602','SWC-78603']},
{id:'LGF-2026-00128',sender:'Boutique Soleil · Esther Mbuyamba',recipient:'Alain Mukendi',origin:'Bandalungwa, Kinshasa',destination:'Masina, Kinshasa',count:1,status:'preparing',codes:['SWC-78701']}
];
const parcelNames={
'LGF-2026-00125':[['Téléviseur Samsung 55 pouces','Samsung 55-inch television'],['Carton de vêtements','Clothing carton'],['Chaussures de sport','Sports shoes'],['Accessoires électroniques','Electronic accessories'],['Sac de vêtements','Bag of clothing']],
'LGF-2026-00126':[['Pièces automobiles','Car parts'],['Batterie de voiture','Car battery']],
'LGF-2026-00127':[['Machine à café','Coffee machine'],['Vaisselle emballée','Packed tableware'],['Petit réfrigérateur','Mini refrigerator']],
'LGF-2026-00128':[['Imprimante de bureau','Office printer']]
};
function qrLink(value){return 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data='+encodeURIComponent(value)}
function parcelQr(value){return '<div style="margin:8px 0"><img loading="lazy" width="120" height="120" alt="QR code" src="'+qrLink(value)+'"><br><small>'+esc(value)+'</small></div>'}
let activeCameraStream=null,activeCameraTimer=null;
function stopParcelCamera(){if(activeCameraTimer){clearInterval(activeCameraTimer);activeCameraTimer=null}if(activeCameraStream){activeCameraStream.getTracks().forEach(t=>t.stop());activeCameraStream=null}const modal=document.getElementById('parcel-camera');if(modal)modal.remove()}
async function openParcelCamera(i){if(!navigator.mediaDevices?.getUserMedia||!('BarcodeDetector' in window)){alert(T('Scanner caméra non disponible dans ce navigateur. Saisissez le code manuellement.','Camera scanning is unavailable in this browser. Enter the code manually.'));return}
let detector;try{detector=new BarcodeDetector({formats:['qr_code','code_128','ean_13','ean_8','upc_a','upc_e','code_39']})}catch(e){alert(T('Ce format de scan n’est pas pris en charge.','This scanning format is not supported.'));return}
stopParcelCamera();const modal=document.createElement('div');modal.id='parcel-camera';modal.style='position:fixed;inset:0;background:#000d;z-index:1000;display:grid;place-items:center;padding:16px';modal.innerHTML='<div style="background:white;border-radius:14px;padding:16px;width:min(100%,480px)"><h3>'+T('Scanner un code colis','Scan parcel code')+'</h3><video id="parcel-video" autoplay muted playsinline style="width:100%;border-radius:10px;background:#222"></video><p class="tiny">'+T('Pointez la caméra vers un QR code ou code-barres.','Point the camera at a QR code or barcode.')+'</p><button id="close-parcel-camera">'+T('Annuler','Cancel')+'</button></div>';document.body.appendChild(modal);document.getElementById('close-parcel-camera').onclick=stopParcelCamera;
try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(!document.getElementById('parcel-camera')){stream.getTracks().forEach(t=>t.stop());return}activeCameraStream=stream;const video=document.getElementById('parcel-video');video.srcObject=stream;await video.play();let busy=false;activeCameraTimer=setInterval(async()=>{if(busy||!activeCameraStream||video.readyState<2)return;busy=true;try{const codes=await detector.detect(video);if(codes.length&&codes[0].rawValue){draftParcels[i].external=codes[0].rawValue;stopParcelCamera();go('create')}}catch(e){console.warn('Scan failed',e)}finally{busy=false}},350)}catch(e){stopParcelCamera();alert(T('Accès caméra refusé ou indisponible. Utilisez la saisie manuelle.','Camera permission denied or unavailable. Use manual entry.'))}}
function scanExternalCode(i){const value=prompt(T('Scannez avec un lecteur clavier ou saisissez le code externe du colis :','Scan with a keyboard barcode reader or enter the parcel external code:'));if(value===null)return;draftParcels[i].external=value.trim();go('create')}
function parcelName(s,i){let names=parcelNames[s.id]||[];return names[i]?T(names[i][0],names[i][1]):T('Colis sans description','Parcel without description')}
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function chooseShipment(id){selectedShipment=id;go('shipment')}
function focusParcel(n){parcelFocus=n;go('parcel')}
function shipmentStatus(s){return s==='exception'?badge(T('1 colis en attente','1 parcel outstanding'),'warn'):s==='transit'?badge(T('En transit','In transit')):s==='delivered'?badge(T('Livré','Delivered')):badge(T('En préparation','Preparing'),'warn')}

let draftItems=[{name:'',qty:1}],draftError='',draftSaved='',draftStep='details',draftParty={},draftParcels=[],parcelMetadata={};
function addDraftItem(){draftItems.push({name:'',qty:1});go('create')}
function removeDraftItem(i){if(draftItems.length>1)draftItems.splice(i,1);go('create')}
function editDraftItem(i,field,value){draftItems[i][field]=field==='qty'?Math.max(1,Math.min(100,parseInt(value,10)||1)):value}
function resetDraft(){draftItems=[{name:'',qty:1}];draftStep='details';draftParty={};draftParcels=[];draftError=''}
function newShipmentForm(){if(draftStep==='parcels')return parcelReviewForm();return `<h1>${T('Créer une expédition','Create shipment')}</h1><p class="sub">${T('Simulation uniquement · aucune donnée envoyée à un serveur','Demo only · no data sent to a server')}</p><div class="panel"><h3>${T('Expéditeur et destinataire','Sender and recipient')}</h3><div class="grid"><div><label>${T('Nom de l’expéditeur','Sender name')}<br><input id="new-sender" style="width:100%" value="${esc(draftParty.sender||'')}" placeholder="Ex: Boutique Soleil"></label><p><label>${T('Adresse de départ','Origin address')}<br><input id="new-origin" style="width:100%" value="${esc(draftParty.origin||'')}" placeholder="Gombe, Kinshasa"></label></p></div><div><label>${T('Nom du destinataire','Recipient name')}<br><input id="new-recipient" style="width:100%" value="${esc(draftParty.recipient||'')}" placeholder="Ex: Marie Kabeya"></label><p><label>${T('Adresse de livraison','Destination address')}<br><input id="new-destination" style="width:100%" value="${esc(draftParty.destination||'')}" placeholder="Limete, Kinshasa"></label></p></div></div><h3>${T('Articles et quantités','Items and quantities')}</h3><p class="tiny">${T('Chaque unité devient un colis distinct, avec photo et code externe facultatifs.','Each unit becomes a separate parcel, with its own optional photo and external code.')}</p>${draftItems.map((item,i)=>`<div class="row"><label style="flex:1">${T('Nom de l’article','Item name')}<br><input style="width:100%" value="${esc(item.name)}" oninput="editDraftItem(${i},'name',this.value)" placeholder="${T('Ex: Téléviseur Samsung 55 pouces','E.g. Samsung 55-inch TV')}"></label><label>${T('Quantité','Quantity')}<br><input type="number" min="1" max="50" style="width:90px" value="${item.qty}" oninput="editDraftItem(${i},'qty',this.value)"></label><button onclick="removeDraftItem(${i})">${T('Retirer','Remove')}</button></div>`).join('')}<div class="actions"><button onclick="addDraftItem()">+ ${T('Ajouter un article','Add item')}</button><button class="primary" onclick="prepareDraftParcels()">${T('Suivant : photos et identifiants','Next: photos and identifiers')}</button></div>${draftError?`<p class="tag danger">${esc(draftError)}</p>`:''}</div>`}
function prepareDraftParcels(){draftParty={sender:document.getElementById('new-sender').value.trim(),recipient:document.getElementById('new-recipient').value.trim(),origin:document.getElementById('new-origin').value.trim(),destination:document.getElementById('new-destination').value.trim()};let total=draftItems.reduce((n,x)=>n+x.qty,0);if(Object.values(draftParty).some(v=>!v)||draftItems.some(x=>!x.name.trim())||total>50){draftError=T('Complétez tous les champs et limitez la démo à 50 colis.','Complete all fields and limit the demo to 50 parcels.');go('create');return}draftError='';draftParcels=draftItems.flatMap(x=>Array.from({length:x.qty},()=>({name:x.name.trim(),external:'',photo:''})));draftStep='parcels';go('create')}
function editExternal(i,v){draftParcels[i].external=v}
async function readParcelPhoto(i,input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert(T('Choisissez une image.','Choose an image.'));input.value='';return}const preview=document.getElementById('photo-preview-'+i);if(preview)preview.textContent=T('Préparation de la photo…','Preparing photo…');try{const image=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image decoding failed'))};img.src=url});let width=image.naturalWidth,height=image.naturalHeight;const scale=Math.min(1,1400/Math.max(width,height));width=Math.max(1,Math.round(width*scale));height=Math.max(1,Math.round(height*scale));const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas unavailable');ctx.drawImage(image,0,0,width,height);let data='';for(const quality of [.8,.65,.5,.35]){data=canvas.toDataURL('image/jpeg',quality);if(data.length<1100000)break}if(data.length>=1800000)throw Error('Photo too large after compression');draftParcels[i].photo=data;if(preview)preview.innerHTML='<img alt="Parcel photo" style="max-width:140px;max-height:110px;border-radius:8px" src="'+data+'"><p class="tiny">'+T('Photo optimisée et prête','Photo optimized and ready')+'</p>'}catch(err){console.warn('Photo preparation failed',err);if(preview)preview.textContent=T('Impossible de préparer cette photo. Réessayez.','Could not prepare this photo. Please retry.');alert(T('La photo ne peut pas être traitée. Réessayez.','Could not process this photo. Please try again.'))}finally{input.value=''}}
function parcelReviewForm(){return `<h1>${T('Photos et identifiants des colis','Parcel photos and identifiers')}</h1><p class="sub">${T('Étape 2 · Chaque colis physique possède sa propre fiche','Step 2 · Each physical parcel has its own record')}</p><div class="notice">${T('Le code LogiFlow est généré automatiquement. Saisissez un code-barres ou QR externe existant, ou laissez vide. Scannez le code existant avec la caméra sur un navigateur compatible, ou saisissez-le manuellement.','LogiFlow generates its own code automatically. Scan an existing code with the camera on a supported browser, or enter it manually.')}</div>${draftParcels.map((p,i)=>`<div class="panel" style="margin:12px 0"><h3>${T('Colis','Parcel')} ${i+1}/${draftParcels.length} · ${esc(p.name)}</h3><p class="tiny">${T('Identifiant LogiFlow','LogiFlow identifier')}: ${'LGF-DEMO-'+String(shipmentData.length+1).padStart(4,'0')+'-P'+String(i+1).padStart(3,'0')} (${T('prévu','planned')})</p>${parcelQr('LGF-DEMO-'+String(shipmentData.length+1).padStart(4,'0')+'-P'+String(i+1).padStart(3,'0'))}<label>${T('Code-barres ou QR externe','External barcode or QR value')}<br><input style="width:100%;max-width:500px" value="${esc(p.external)}" placeholder="SWC-78451" oninput="editExternal(${i},this.value)"><button type="button" onclick="scanExternalCode(${i})">${T('Saisir / scanner','Enter / scan')}</button><button type="button" onclick="openParcelCamera(${i})">${T('Caméra QR / code-barres','Camera QR / barcode')}</button></label><p><label>${T('Photo du colis · appareil photo ou galerie','Parcel photo · camera or gallery')}<br><input type="file" accept="image/*" capture="environment" onchange="readParcelPhoto(${i},this)"></label></p><div id="photo-preview-${i}">${p.photo?'<img alt="Parcel photo" style="max-width:140px;max-height:110px;border-radius:8px" src="'+p.photo+'">':`<span class="tiny">${T('Aucune photo choisie','No photo selected')}</span>`}</div></div>`).join('')}<div class="actions"><button onclick="draftStep='details';go('create')">← ${T('Retour','Back')}</button><button class="primary" onclick="saveDraftShipment()">${T('Créer dans la démo','Create in demo')}</button></div>${draftError?`<p class="tag danger">${esc(draftError)}</p>`:''}<p class="tiny">${T('Les photos sont enregistrées localement dans ce navigateur lors de la création, selon l’espace disponible. Aucun envoi au serveur.','Photos are saved locally in this browser when the shipment is created, subject to storage limits. No server upload.')}</p>`}
const DEMO_STORAGE_KEY='logiflow-demo-shipments-v1';
function restoreDemoShipments(){try{const saved=JSON.parse(localStorage.getItem(DEMO_STORAGE_KEY)||'null');if(!saved||!Array.isArray(saved.shipments))return;for(const entry of saved.shipments){if(!entry||typeof entry.id!=='string'||!entry.id.startsWith('LGF-DEMO-')||!Array.isArray(entry.codes))continue;if(shipmentData.some(x=>x.id===entry.id))continue;shipmentData.push(entry);parcelNames[entry.id]=saved.names?.[entry.id]||entry.codes.map(()=>['Parcel','Parcel']);parcelMetadata[entry.id]=saved.metadata?.[entry.id]||[]}}catch(e){console.warn('Demo shipment restore unavailable',e)}}
function persistDemoShipments(){try{const shipments=shipmentData.filter(s=>s.id.startsWith('LGF-DEMO-'));const names={},metadata={};for(const s of shipments){names[s.id]=parcelNames[s.id];metadata[s.id]=parcelMetadata[s.id]}localStorage.setItem(DEMO_STORAGE_KEY,JSON.stringify({shipments,names,metadata}));return true}catch(e){console.warn('Demo storage full or unavailable',e);return false}}
restoreDemoShipments();

function findLoadingTrip(){
 const code=(document.getElementById('loading-lookup')?.value||'').trim().toLowerCase();
 if(!code)return;
 const plans=plannedTrips();
 const match=shipmentData.find(s=>s.id.toLowerCase()===code||plans[s.id]?.id?.toLowerCase()===code||s.codes.some(c=>c.toLowerCase()===code)||(s.id+'-P001').toLowerCase()===code);
 const status=document.getElementById('loading-lookup-status');
 if(!match){if(status)status.textContent=T('Code inconnu. Vérifiez le code et réessayez.','Unknown code. Check the code and try again.');return}
 if(!plans[match.id]){if(status)status.textContent=T('Aucun trajet affecté à ce colis.','No assigned trip for this parcel.');return}
 selectLoadingTrip(match.id);
}

function vehicleCompliance(v){const c=complianceData(),today=new Date().toISOString().slice(0,10),country=v.country||'CD';const items=c.requirements.filter(q=>q.entity==='vehicle'&&(q.country==='ALL'||q.country===country)&&(q.vehicleType==='all'||q.vehicleType===v.type)).map(q=>{const docs=c.documents.filter(z=>z.requirementId===q.id&&z.entityId===v.id).sort((a,b)=>(b.uploadedAt||'').localeCompare(a.uploadedAt||''));const doc=docs[0];const status=!doc?'Missing':doc.status==='rejected'?'Rejected':q.expires&&(!doc.expiry||doc.expiry<today)?'Expired':doc.status==='approved'?'Approved':'Pending review';return {q,doc,status}});const blockers=items.filter(x=>x.q.mandatory&&x.status!=='Approved');return {items,status:blockers.some(x=>['Missing','Rejected','Expired'].includes(x.status))?'Not compliant':blockers.length?'Pending verification':items.length?'Compliant':'Not configured'}}function licenceRenewalPanel(v){const doc=v.licenceRenewal;return '<section class="panel"><h3>Renew licence disc</h3><p class="sub">Upload the renewed licence disc for fleet manager review. Updating a date alone does not verify a document.</p><label>New expiry date<input id="licence-renewal-expiry" type="date" value="'+esc(doc?.expiry||'')+'"></label><label>Licence disc photo or PDF<input type="file" accept="image/*,application/pdf" onchange="licenceRenewalChoose(this)"></label><p class="tiny" id="licence-renewal-file-status">Photos are compressed; PDF limit 1.2 MB for browser storage.</p><button class="primary" onclick="licenceRenewalSubmit(\''+v.id+'\')">Submit renewal for review</button>'+(doc?'<div class="fleet-detail-field"><b>Submitted: '+esc(doc.name)+'</b><small>Review status: '+esc(doc.status)+' · New expiry '+esc(doc.expiry)+'</small></div><a href="'+doc.data+'" target="_blank" rel="noopener">View submitted evidence</a>'+(doc.status==='pending'?'<div class="actions"><button class="primary" onclick="licenceRenewalReview(\''+v.id+'\',true)">Accept document</button><button onclick="licenc function updateDemoJourney(id,action){
 const p=plannedTrips()[id],trip=startedTrips()[id],sh=shipmentData.find(x=>x.id===id),d=currentDemoDriver();
 if(!p||!d||p.driverId!==d.id||p.response!=='accepted'||!p.driverConfirmedAt||!trip?.startedAt||trip.completedAt||!sh)return alert('No authorized active demo trip');
 if(Object.keys(deliveryRecords()[id]||{}).length>=sh.count)return alert('Stop already completed');
 const journeys=demoJourneys(),current=journeys[id]?.status||'ready';
 if(action==='on_way'&&current!=='ready'||action==='arrived'&&current!=='on_way')return alert('Journey status already changed or invalid transition');
 journeys[id]={status:action,at:new Date().toISOString()};
 try{localStorage.setItem(journeyKey,JSON.stringify(journeys))}catch{return alert('Could not save journey status')}
 render();
}
function demoJourneyControls(id){
 const state=demoJourneys()[id]?.status||'ready';
 return '<div style="margin:12px 0"><b>Driver journey status: '+(state==='on_way'?'On the way':state==='arrived'?'Arrived at customer':'Ready for delivery')+'</b><p class="tiny">Demo status stored only in this browser. Customer links on other devices are NOT updated.</p>'+
 (state==='ready'?'<button class="primary" onclick="updateDemoJourney(\''+esc(id)+'\',\'on_way\')">Start journey to customer</button>':state==='on_way'?'<button class="primary" onclick="updateDemoJourney(\''+esc(id)+'\',\'arrived\')">I have arrived</button>':'<p>Arrival recorded. Scan parcel to confirm handover.</p>')+'</div>';
}
function tripVehicleDescription(p){const v=fleetData().vehicles.find(x=>x.id===p.vehicleId||x.reg===p.vehicle);return [v?.make||'',v?.model||''].filter(Boolean).join(' ') + (v?.color?' · '+v.color:'') + ' · '+(p.vehicle||'Registration unavailable')}

// Multi-stop delivery planning preview. Estimates are illustrative, not live traffic/GPS.
// Delivery progress is derived from parcel handover records, never a separate stop toggle.
// Estimates are illustrative and exclude completed stops; no GPS or routing is connected.
function demoStopSchedule(){
 const active=driverAssignedPlans().filter(([id,p])=>p.response==='accepted'&&p.driverConfirmedAt&&startedTrips()[id]?.startedAt);
 const all=active.map(([id,p])=>{const sh=shipmentData.find(x=>x.id===id);if(!sh)return null;
 const completed=Object.keys(deliveryRecords()[id]||{}).length;
 return {id,trip:p.id,destination:sh.destination,recipient:sh.recipient,total:sh.count,completed,done:completed>=sh.count};}).filter(Boolean);
 let pending=0;
 return all.map(s=>({...s,minutes:s.done?null:(++pending)*25}));
}
function demoEtaText(minutes){return minutes===null?'Completed':new Date(Date.now()+minutes*60000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
function demoRoutePanel(){
 const stops=demoStopSchedule();
 if(!stops.length)return '';
 const completed=stops.filter(s=>s.done).length,next=stops.find(s=>!s.done);
 return '<section class="panel" style="border-left:4px solid #17b8a6"><h3>Delivery route · '+completed+'/'+stops.length+' stops completed</h3>'+
 '<p class="sub">Browser demo: stop completion follows verified parcel scan and driver-declared handover. Customer PIN and GPS are not connected.</p>'+
 (next?'<div class="notice"><b>Next stop: '+esc(next.destination)+'</b><p>'+esc(next.recipient||'Recipient not recorded')+' · '+(next.total-next.completed)+' parcel(s) remaining</p><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(next.destination)+'&travelmode=driving">Open area navigation</a></div>':'<div class="notice">All delivery stops completed in this browser demo.</div>')+
 stops.map((s,i)=>'<div class="row"><div><b>Stop '+(i+1)+' · '+esc(s.destination)+'</b><br><small>'+esc(s.recipient||'Recipient not recorded')+' · '+s.completed+'/'+s.total+' parcels delivered</small></div><div style="text-align:right"><b>'+(s.done?'✓ Completed':demoEtaText(s.minutes))+'</b><br><small>'+(s.done?'Recorded handover':'Illustrative ETA')+'</small></div></div>').join('')+
 '<p class="tiny">Pending stops use a 25-minute-per-stop demonstration estimate, recalculated when the page renders. Not a live arrival promise. No traffic, GPS, recipient notification or automatic PIN verification.</p></section>';
}
function deliveryScreen(){
 const entries=driverAssignedPlans().filter(([id,p])=>p.response==='accepted'&&p.driverConfirmedAt&&startedTrips()[id]?.startedAt);
 return '<h1>Scan delivery</h1><p class="sub">Verify each parcel against its active trip. Demo records stay in this browser; no real recipient verification or backend.</p>'+demoRoutePanel()+
 (entries.map(([id,p])=>{const sh=shipmentData.find(x=>x.id===id);if(!sh)return '';const records=deliveryRecords()[id]||{},count=Object.keys(records).length;
 return '<div class="panel"><h3>'+esc(p.id)+'</h3><p>'+esc(sh.origin)+' → '+esc(sh.destination)+'</p><div class="notice"><b>Destination navigation</b><p>'+esc(sh.destination)+'</p><p class="tiny">Exact street address not recorded. Distance and ETA unavailable until routing and location are connected.</p><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(sh.destination)+'&travelmode=driving">Open Google Maps (area only)</a></div><p><b>Delivery vehicle:</b> '+esc(tripVehicleDescription(p))+'</p><p><b>Recipient:</b> '+esc(sh.recipient||'Not recorded')+'</p><p class="tiny">Customer PIN verification and automatic WhatsApp/SMS are not yet connected. Do not treat a driver declaration as verified customer handover.</p><p><b>'+count+'/'+sh.count+' parcels delivered</b></p>'+
 (count<sh.count&&demoJourneys()[id]?.status!=='arrived'?'<div class="notice">Delivery scanning is locked until the driver records arrival at this stop. Return to Driver Home and use Start journey, then I have arrived.</div>':count===sh.count?'<div class="notice">✓ All parcels delivered. Trip complete (browser demo).</div>':'<label>Scan or enter parcel identifier<input id="delivery-code-'+esc(id)+'" placeholder="LogiFlow code or external barcode" autocomplete="off"></label><button class="primary" onclick="verifyDeliveryCode(\''+esc(id)+'\')">Verify parcel</button><div id="delivery-result-'+esc(id)+'" aria-live="polite"></div>')+
 sh.codes.map((c,i)=>{const key=sh.id+'-P'+String(i+1).padStart(3,'0'),done=records[i];return '<div style="padding:10px 0;border-top:1px solid #ddd"><b>'+esc(parcelName(sh,i))+'</b><br><small>'+esc(key)+' · '+esc((parcelMetadata[id]||[])[i]?.external||c)+'</small><br><small>'+(done?'✓ Delivered '+esc(new Date(done.at).toLocaleString()):'Awaiting delivery')+'</small></div>'}).join('')+'</div>';
 }).join('')||'<div class="panel">No started trips ready for delivery.</div>');
}
function verifyDeliveryCode(id){
 const sh=shipmentData.find(x=>x.id===id),p=plannedTrips()[id],trip=startedTrips()[id],d=currentDemoDriver(),field=document.getElementById('delivery-code-'+id),out=document.getElementById('delivery-result-'+id);
 if(!sh||!p||!d||p.driverId!==d.id||!p.driverConfirmedAt||!trip?.startedAt||trip.completedAt||demoJourneys()[id]?.status!=='arrived')return;
 const code=(field?.value||'').trim().toLowerCase();
 const i=sh.codes.findIndex((c,n)=>c.toLowerCase()===code||(sh.id+'-P'+String(n+1).padStart(3,'0')).toLowerCase()===code||((parcelMetadata[id]||[])[n]?.external||'').toLowerCase()===code);
 if(i<0){out.textContent='Identifier not found on this trip.';return}
 if(!(loadedCodes()[id]||[]).includes(i)){out.textContent='Parcel was not loaded on this trip.';return}
 if(deliveryRecords()[id]?.[i]){out.textContent='Already delivered. Duplicate confirmation blocked.';return}
 out.innerHTML='<div class="notice"><b>'+esc(parcelName(sh,i))+'</b><p>Code verified. Confirm physical handover to '+esc(sh.recipient||'the recipient')+'.</p><label>Recipient or receiver name<input id="delivery-receiver" placeholder="Name of person receiving"></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="delivery-proof"> I physically handed this parcel to the named receiver (demo declaration)</label><button class="primary" onclick="confirmDemoDelivery(\''+esc(id)+'\','+i+')">Record delivery</button></div>';
}
function confirmDemoDelivery(id,i){
 const sh=shipmentData.find(x=>x.id===id),p=plannedTrips()[id],d=currentDemoDriver(),trips=startedTrips(),trip=trips[id],receiver=document.getElementById('delivery-receiver')?.value.trim(),proof=document.getElementById('delivery-proof')?.checked;
 if(previewRole!=='driver'||!d||!p||p.driverId!==d.id||!sh||!trip?.startedAt||trip.completedAt||demoJourneys()[id]?.status!=='arrived')return;
 if(!receiver||!proof)return alert('Receiver name and physical handover declaration are required.');
 if(!confirm('Record delivery of '+parcelName(sh,i)+' to '+receiver+'?'))return;
 const all=deliveryRecords();all[id]||={};if(all[id][i])return alert('Parcel already delivered');
 all[id][i]={at:new Date().toISOString(),receiver,code:sh.id+'-P'+String(i+1).padStart(3,'0'),proofType:'driver-declaration'};
 try{localStorage.setItem(deliveryKey,JSON.stringify(all))}catch{return alert('Could not save delivery record')}
 if(Object.keys(all[id]).length===sh.count){trip.completedAt=new Date().toISOString();trips[id]=trip;localStorage.setItem(tripKey,JSON.stringify(trips))}
 render();
}

if(page==='customer')h=`<div class="panel"><h3>📱 Customer notification preview / Aperçu du message client</h3><p>Hello! Your LogiFlow parcel LGF-2026-00125 is on its way. Track delivery without logging in:</p><p><a href="?tracking=demo">Open customer tracking link / Ouvrir le suivi</a></p><div class="actions"><button onclick="navigator.clipboard?.writeText(location.origin+location.pathname+'?tracking=demo')">Copy demo tracking link</button><button onclick="window.open(location.origin+location.pathname+'?tracking=demo','_blank','noopener')">Simulate customer opening link</button></div><p class="tiny">Demo only: no WhatsApp/SMS was sent; this link contains no real security token and must not be used for customer data.</p></div><h1>${T('Suivi public de livraison','Public delivery tracking')}</h1><p class="sub">LGF-2026-00125 · ${T('Lien sécurisé simulé · sans compte','Simulated secure link · no account')}</p><div class="grid"><div class="panel"><h3>${T('Votre livraison','Your delivery')}</h3>${badge(delivered?T('Livré','Delivered'):tripStarted?T('En cours de livraison','Out for delivery'):T('En préparation','Preparing'))}<h2>${delivered?T('Livraison terminée','Delivery complete'):T('Votre livraison est l’arrêt 5 sur 5','Your delivery is stop 5 of 5')}</h2><p>${T('Arrêts restants avant vous','Stops remaining before yours')}: <b>${delivered?0:Math.max(0,5-stop)}</b></p><div class="progress"><div style="width:${delivered?100:(stop-1)*25}%"></div></div><p>${T('Heure estimée (simulation)','Estimated arrival (demo)')}: 14:30–15:00</p><p class="tiny">${T('Localisation fictive; aucune donnée GPS en direct.','Illustrative location; no live GPS data.')}</p><div class="actions"><button onclick="stop=Math.min(5,stop+1);tripStarted=true;render()">${T('Simuler l’arrêt suivant','Simulate next stop')}</button><button onclick="go('delivery')">${T('Confirmer livraison','Confirm delivery')}</button></div></div><div class="panel"><h3>${stop>=4?T('Chauffeur à proximité','Driver approaching'):T('Progression des arrêts','Stop progress')}</h3>${stop>=4?map():`<div class="notice">${T('La carte de proximité s’affichera à l’approche du chauffeur.','The proximity map appears when the driver approaches.')}</div>`}<p class="tiny">${T('Aucune adresse ou information sur les autres clients n’est affichée.','Other customers’ addresses and details are hidden.')}</p></div></div>`;
if(page==='delivery')h=`<h1>${T('Preuve de livraison','Proof of delivery')}</h1><div class="panel"><p>${T('Confirmer les colis réellement remis. Le PIN ne valide pas les colis manquants.','Confirm parcels physically handed over. PIN does not validate missing parcels.')}</p><label>${T('Nombre de colis remis','Parcels handed over')}: <select id="qty">${[1,2,3,4,5].map(i=>`<option ${i===4?'selected':''}>${i}</option>`).join('')}</select></label><p><input id="dpin" placeholder="PIN (demo: 2468)" type="password" autocomplete="off"></p><p><label><input type="checkbox" id="proof"> ${T('Preuve de remise recueillie (signature/photo simulée)','Handover evidence captured (simulated signature/photo)')}</label></p><button class="primary" onclick="if(document.getElementById('dpin').value!=='2468'||!document.getElementById('proof').checked){pinError='${T('PIN valide et preuve requis.','Valid PIN and evidence required.')}';render();return}const q=+document.getElementById('qty').value;if(q<5){alert('${T('Livraison partielle enregistrée; les autres colis restent ouverts.','Partial delivery recorded; remaining parcels stay open.')}')}else{delivered=true}pinError='';go('customer')">${T('Vérifier et enregistrer','Verify and record')}</button>${pinError?`<p class="tag danger">${pinError}</p>`:''}<p class="tiny">${T('Démo uniquement : PIN 2468. Aucune validation serveur ni notification réelle.','Demo only: PIN 2468. No server validation or real notifications.')}</p></div>`;document.getElementById('app').innerHTML=h}render();</script></body></html>
