<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogiFlow · Prototype interactif</title><style>:root{font-family:Inter,system-ui,Arial;background:#f4f7fb;color:#172b43}*{box-sizing:border-box}body{margin:0}header{background:#102c46;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:23px}button,select,input{font:inherit}button{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;background:#e8eef5;color:#16314b}button.primary{background:#17b8a6;color:#062e32;font-weight:700}button:hover{filter:brightness(.95)}.layout{display:flex;min-height:calc(100vh - 68px)}nav{width:230px;background:#fff;border-right:1px solid #e0e6ee;padding:15px;flex-shrink:0}nav button{display:block;width:100%;text-align:left;background:transparent;margin-bottom:5px}nav button.active{background:#dff6f2;color:#07675c;font-weight:700}main{padding:25px;max-width:1200px;width:100%;margin:auto}.sub{color:#687a8e}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin:20px 0}.card,.panel{background:white;border:1px solid #e1e9f0;border-radius:14px;padding:18px;box-shadow:0 3px 13px #132c4208}.card strong{display:block;font-size:28px;margin:8px 0}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #edf0f3;padding:12px 0}.row:last-child{border:0}.tag{border-radius:30px;background:#e9f7f2;color:#11715f;padding:5px 10px;font-size:12px}.warn{background:#fff2dc;color:#9b5b00}.danger{background:#ffebeb;color:#a62e37}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input,select{padding:10px;border:1px solid #cbd7e2;border-radius:8px;max-width:100%}.map{height:270px;border-radius:12px;background:linear-gradient(125deg,#e0ece7,#eaf3e9);position:relative;overflow:hidden;border:1px solid #cddfd8}.road{position:absolute;height:12px;background:#fff;transform:rotate(-20deg);width:130%;top:40%;left:-10%;box-shadow:0 80px 0 #fff,0 -75px 0 #fff}.road.two{transform:rotate(53deg);top:45%;left:-15%}.pin{position:absolute;background:#173d59;color:white;border:3px solid white;border-radius:50%;width:33px;height:33px;display:grid;place-items:center;font-size:12px;font-weight:bold;box-shadow:0 3px 9px #0003}.timeline{border-left:3px solid #1ab7a6;margin:15px 0 15px 10px;padding-left:20px}.timeline div{padding:10px 0}.notice{background:#edf9f7;border-left:4px solid #1ab7a6;padding:12px;margin:15px 0;border-radius:5px}.tiny{font-size:12px;color:#6c7c8c}.progress{background:#dce6ec;border-radius:12px;height:11px;overflow:hidden}.progress div{background:#1ab7a6;height:100%}@media(max-width:750px){.layout{display:block}nav{position:fixed;bottom:0;left:0;right:0;width:100%;display:flex;overflow:visible;padding:7px 4px calc(7px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid #d9e4ed;z-index:40;box-shadow:0 -4px 20px #102c4615}nav button{flex:1;min-width:0;padding:10px 2px;font-size:11px;text-align:center;margin:0}main{padding:14px 14px 100px}.grid{grid-template-columns:1fr}header{padding:13px}header b{font-size:19px}}@media(max-width:750px){.home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.home-tile{display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;padding:22px 16px;min-height:156px;border:1px solid #e1e9e9;border-radius:18px;background:#fff;color:#244052;white-space:normal}.home-tile b{font-size:18px}.home-tile small{font-size:13px;color:#667c88}.tile-icon{font-size:28px;color:#18a997}@media(max-width:370px){.home-grid{gap:9px}.home-tile{padding:16px 10px}.home-tile b{font-size:15px}}.fleet-tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 14px;margin-bottom:12px;scrollbar-width:thin}.fleet-tabs button{white-space:nowrap;flex-shrink:0;border-radius:24px}.fleet-tabs button.active{background:#dff6f2;color:#07675c;font-weight:700}.fleet-tabs+ .panel{margin-top:8px}.fleet-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.fleet-fields label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}.fleet-fields input,.fleet-fields select{width:100%;min-height:43px}.fleet-form .sub{font-weight:700;margin-top:18px}</style></head><body><header><div><b>◈ LogiFlow</b> <small> · Kinshasa · DEMO</small></div><span style="font-size:11px;opacity:.85">v0.2.11</span><button onclick="toggleLang()" id="lang">EN</button></header><div class="layout"><nav id="nav"></nav><main id="app"></main></div><script>
let lang='fr',page='home',received=4,approved=false,loaded=false,tripStarted=false,stop=1,delivered=false,pinError='',collection=false;
let selectedShipment='LGF-2026-00125',parcelFocus=1,shipmentQuery='';
const shipmentData=[
{id:'LGF-2026-00125',sender:'Kinshasa Fashion · Jean Mbuyi',recipient:'Marie Kabeya',origin:'Gombe, Kinshasa',destination:'Limete, Kinshasa',count:5,status:'exception',codes:['SWC-78451','SWC-78452','SWC-78453','SWC-78454','SWC-78455']},
{id:'LGF-2026-00126',sender:'Marché Central · Chantal Ilunga',recipient:'Patrick Kalala',origin:'Gombe, Kinshasa',destination:'Matete, Kinshasa',count:2,status:'transit',codes:['SWC-78501','SWC-78502']},
{id:'LGF-2026-00127',sender:'Maison Kivu · David Tshibangu',recipient:'Sarah Luyindula',origin:'Ngaliema, Kinshasa',destination:'Lemba, Kinshasa',count:3,status:'delivered',codes:['SWC-78601','SWC-78602','SWC-78603']},
{id:'LGF-2026-00128',sender:'Boutique Soleil · Esther Mbuyamba',recipient:'Alain Mukendi',origin:'Bandalungwa, Kinshasa',destination:'Masina, Kinshasa',count:1,status:'preparing',codes:['SWC-78701']}
];
const parcelNames={
'LGF-2026-00125':[['Téléviseur Samsung 55 pouces','Samsung 55-inch television'],['Carton de vêtements','Clothing carton'],['Chaussures de sport','Sports shoes'],['Accessoires électroniques','Electronic accessories'],['Sac de vêtements','Bag of clothing']],
'LGF-2026-00126':[['Pièces automobiles','Car parts'],['Batterie de voiture','Car battery']],
'LGF-2026-00127':[['Machine à café','Coffee machine'],['Vaisselle emballée','Packed tableware'],['Petit réfrigérateur','Mini refrigerator']],
'LGF-2026-00128':[['Imprimante de bureau','Office printer']]
};
function qrLink(value){return 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data='+encodeURIComponent(value)}
function parcelQr(value){return '<div style="margin:8px 0"><img loading="lazy" width="120" height="120" alt="QR code" src="'+qrLink(value)+'"><br><small>'+esc(value)+'</small></div>'}
let activeCameraStream=null,activeCameraTimer=null;
function stopParcelCamera(){if(activeCameraTimer){clearInterval(activeCameraTimer);activeCameraTimer=null}if(activeCameraStream){activeCameraStream.getTracks().forEach(t=>t.stop());activeCameraStream=null}const modal=document.getElementById('parcel-camera');if(modal)modal.remove()}
async function openParcelCamera(i){if(!navigator.mediaDevices?.getUserMedia||!('BarcodeDetector' in window)){alert(T('Scanner caméra non disponible dans ce navigateur. Saisissez le code manuellement.','Camera scanning is unavailable in this browser. Enter the code manually.'));return}
let detector;try{detector=new BarcodeDetector({formats:['qr_code','code_128','ean_13','ean_8','upc_a','upc_e','code_39']})}catch(e){alert(T('Ce format de scan n’est pas pris en charge.','This scanning format is not supported.'));return}
stopParcelCamera();const modal=document.createElement('div');modal.id='parcel-camera';modal.style='position:fixed;inset:0;background:#000d;z-index:1000;display:grid;place-items:center;padding:16px';modal.innerHTML='<div style="background:white;border-radius:14px;padding:16px;width:min(100%,480px)"><h3>'+T('Scanner un code colis','Scan parcel code')+'</h3><video id="parcel-video" autoplay muted playsinline style="width:100%;border-radius:10px;background:#222"></video><p class="tiny">'+T('Pointez la caméra vers un QR code ou code-barres.','Point the camera at a QR code or barcode.')+'</p><button id="close-parcel-camera">'+T('Annuler','Cancel')+'</button></div>';document.body.appendChild(modal);document.getElementById('close-parcel-camera').onclick=stopParcelCamera;
try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(!document.getElementById('parcel-camera')){stream.getTracks().forEach(t=>t.stop());return}activeCameraStream=stream;const video=document.getElementById('parcel-video');video.srcObject=stream;await video.play();let busy=false;activeCameraTimer=setInterval(async()=>{if(busy||!activeCameraStream||video.readyState<2)return;busy=true;try{const codes=await detector.detect(video);if(codes.length&&codes[0].rawValue){draftParcels[i].external=codes[0].rawValue;stopParcelCamera();go('create')}}catch(e){console.warn('Scan failed',e)}finally{busy=false}},350)}catch(e){stopParcelCamera();alert(T('Accès caméra refusé ou indisponible. Utilisez la saisie manuelle.','Camera permission denied or unavailable. Use manual entry.'))}}
function scanExternalCode(i){const value=prompt(T('Scannez avec un lecteur clavier ou saisissez le code externe du colis :','Scan with a keyboard barcode reader or enter the parcel external code:'));if(value===null)return;draftParcels[i].external=value.trim();go('create')}
function parcelName(s,i){let names=parcelNames[s.id]||[];return names[i]?T(names[i][0],names[i][1]):T('Colis sans description','Parcel without description')}
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function chooseShipment(id){selectedShipment=id;go('shipment')}
function focusParcel(n){parcelFocus=n;go('parcel')}
function shipmentStatus(s){return s==='exception'?badge(T('1 colis en attente','1 parcel outstanding'),'warn'):s==='transit'?badge(T('En transit','In transit')):s==='delivered'?badge(T('Livré','Delivered')):badge(T('En préparation','Preparing'),'warn')}

let draftItems=[{name:'',qty:1}],draftError='',draftSaved='',draftStep='details',draftParty={},draftParcels=[],parcelMetadata={};
function addDraftItem(){draftItems.push({name:'',qty:1});go('create')}
function removeDraftItem(i){if(draftItems.length>1)draftItems.splice(i,1);go('create')}
function editDraftItem(i,field,value){draftItems[i][field]=field==='qty'?Math.max(1,Math.min(100,parseInt(value,10)||1)):value}
function resetDraft(){draftItems=[{name:'',qty:1}];draftStep='details';draftParty={};draftParcels=[];draftError=''}
function newShipmentForm(){if(draftStep==='parcels')return parcelReviewForm();return `<h1>${T('Créer une expédition','Create shipment')}</h1><p class="sub">${T('Simulation uniquement · aucune donnée envoyée à un serveur','Demo only · no data sent to a server')}</p><div class="panel"><h3>${T('Expéditeur et destinataire','Sender and recipient')}</h3><div class="grid"><div><label>${T('Nom de l’expéditeur','Sender name')}<br><input id="new-sender" style="width:100%" value="${esc(draftParty.sender||'')}" placeholder="Ex: Boutique Soleil"></label><p><label>${T('Adresse de départ','Origin address')}<br><input id="new-origin" style="width:100%" value="${esc(draftParty.origin||'')}" placeholder="Gombe, Kinshasa"></label></p></div><div><label>${T('Nom du destinataire','Recipient name')}<br><input id="new-recipient" style="width:100%" value="${esc(draftParty.recipient||'')}" placeholder="Ex: Marie Kabeya"></label><p><label>${T('Adresse de livraison','Destination address')}<br><input id="new-destination" style="width:100%" value="${esc(draftParty.destination||'')}" placeholder="Limete, Kinshasa"></label></p></div></div><h3>${T('Articles et quantités','Items and quantities')}</h3><p class="tiny">${T('Chaque unité devient un colis distinct, avec photo et code externe facultatifs.','Each unit becomes a separate parcel, with its own optional photo and external code.')}</p>${draftItems.map((item,i)=>`<div class="row"><label style="flex:1">${T('Nom de l’article','Item name')}<br><input style="width:100%" value="${esc(item.name)}" oninput="editDraftItem(${i},'name',this.value)" placeholder="${T('Ex: Téléviseur Samsung 55 pouces','E.g. Samsung 55-inch TV')}"></label><label>${T('Quantité','Quantity')}<br><input type="number" min="1" max="50" style="width:90px" value="${item.qty}" oninput="editDraftItem(${i},'qty',this.value)"></label><button onclick="removeDraftItem(${i})">${T('Retirer','Remove')}</button></div>`).join('')}<div class="actions"><button onclick="addDraftItem()">+ ${T('Ajouter un article','Add item')}</button><button class="primary" onclick="prepareDraftParcels()">${T('Suivant : photos et identifiants','Next: photos and identifiers')}</button></div>${draftError?`<p class="tag danger">${esc(draftError)}</p>`:''}</div>`}
function prepareDraftParcels(){draftParty={sender:document.getElementById('new-sender').value.trim(),recipient:document.getElementById('new-recipient').value.trim(),origin:document.getElementById('new-origin').value.trim(),destination:document.getElementById('new-destination').value.trim()};let total=draftItems.reduce((n,x)=>n+x.qty,0);if(Object.values(draftParty).some(v=>!v)||draftItems.some(x=>!x.name.trim())||total>50){draftError=T('Complétez tous les champs et limitez la démo à 50 colis.','Complete all fields and limit the demo to 50 parcels.');go('create');return}draftError='';draftParcels=draftItems.flatMap(x=>Array.from({length:x.qty},()=>({name:x.name.trim(),external:'',photo:''})));draftStep='parcels';go('create')}
function editExternal(i,v){draftParcels[i].external=v}
async function readParcelPhoto(i,input){const file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert(T('Choisissez une image.','Choose an image.'));input.value='';return}const preview=document.getElementById('photo-preview-'+i);if(preview)preview.textContent=T('Préparation de la photo…','Preparing photo…');try{const image=await new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Image decoding failed'))};img.src=url});let width=image.naturalWidth,height=image.naturalHeight;const scale=Math.min(1,1400/Math.max(width,height));width=Math.max(1,Math.round(width*scale));height=Math.max(1,Math.round(height*scale));const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas unavailable');ctx.drawImage(image,0,0,width,height);let data='';for(const quality of [.8,.65,.5,.35]){data=canvas.toDataURL('image/jpeg',quality);if(data.length<1100000)break}if(data.length>=1800000)throw Error('Photo too large after compression');draftParcels[i].photo=data;if(preview)preview.innerHTML='<img alt="Parcel photo" style="max-width:140px;max-height:110px;border-radius:8px" src="'+data+'"><p class="tiny">'+T('Photo optimisée et prête','Photo optimized and ready')+'</p>'}catch(err){console.warn('Photo preparation failed',err);if(preview)preview.textContent=T('Impossible de préparer cette photo. Réessayez.','Could not prepare this photo. Please retry.');alert(T('La photo ne peut pas être traitée. Réessayez.','Could not process this photo. Please try again.'))}finally{input.value=''}}
function parcelReviewForm(){return `<h1>${T('Photos et identifiants des colis','Parcel photos and identifiers')}</h1><p class="sub">${T('Étape 2 · Chaque colis physique possède sa propre fiche','Step 2 · Each physical parcel has its own record')}</p><div class="notice">${T('Le code LogiFlow est généré automatiquement. Saisissez un code-barres ou QR externe existant, ou laissez vide. Scannez le code existant avec la caméra sur un navigateur compatible, ou saisissez-le manuellement.','LogiFlow generates its own code automatically. Scan an existing code with the camera on a supported browser, or enter it manually.')}</div>${draftParcels.map((p,i)=>`<div class="panel" style="margin:12px 0"><h3>${T('Colis','Parcel')} ${i+1}/${draftParcels.length} · ${esc(p.name)}</h3><p class="tiny">${T('Identifiant LogiFlow','LogiFlow identifier')}: ${'LGF-DEMO-'+String(shipmentData.length+1).padStart(4,'0')+'-P'+String(i+1).padStart(3,'0')} (${T('prévu','planned')})</p>${parcelQr('LGF-DEMO-'+String(shipmentData.length+1).padStart(4,'0')+'-P'+String(i+1).padStart(3,'0'))}<label>${T('Code-barres ou QR externe','External barcode or QR value')}<br><input style="width:100%;max-width:500px" value="${esc(p.external)}" placeholder="SWC-78451" oninput="editExternal(${i},this.value)"><button type="button" onclick="scanExternalCode(${i})">${T('Saisir / scanner','Enter / scan')}</button><button type="button" onclick="openParcelCamera(${i})">${T('Caméra QR / code-barres','Camera QR / barcode')}</button></label><p><label>${T('Photo du colis · appareil photo ou galerie','Parcel photo · camera or gallery')}<br><input type="file" accept="image/*" capture="environment" onchange="readParcelPhoto(${i},this)"></label></p><div id="photo-preview-${i}">${p.photo?'<img alt="Parcel photo" style="max-width:140px;max-height:110px;border-radius:8px" src="'+p.photo+'">':`<span class="tiny">${T('Aucune photo choisie','No photo selected')}</span>`}</div></div>`).join('')}<div class="actions"><button onclick="draftStep='details';go('create')">← ${T('Retour','Back')}</button><button class="primary" onclick="saveDraftShipment()">${T('Créer dans la démo','Create in demo')}</button></div>${draftError?`<p class="tag danger">${esc(draftError)}</p>`:''}<p class="tiny">${T('Les photos sont enregistrées localement dans ce navigateur lors de la création, selon l’espace disponible. Aucun envoi au serveur.','Photos are saved locally in this browser when the shipment is created, subject to storage limits. No server upload.')}</p>`}
const DEMO_STORAGE_KEY='logiflow-demo-shipments-v1';
function restoreDemoShipments(){try{const saved=JSON.parse(localStorage.getItem(DEMO_STORAGE_KEY)||'null');if(!saved||!Array.isArray(saved.shipments))return;for(const entry of saved.shipments){if(!entry||typeof entry.id!=='string'||!entry.id.startsWith('LGF-DEMO-')||!Array.isArray(entry.codes))continue;if(shipmentData.some(x=>x.id===entry.id))continue;shipmentData.push(entry);parcelNames[entry.id]=saved.names?.[entry.id]||entry.codes.map(()=>['Parcel','Parcel']);parcelMetadata[entry.id]=saved.metadata?.[entry.id]||[]}}catch(e){console.warn('Demo shipment restore unavailable',e)}}
function persistDemoShipments(){try{const shipments=shipmentData.filter(s=>s.id.startsWith('LGF-DEMO-'));const names={},metadata={};for(const s of shipments){names[s.id]=parcelNames[s.id];metadata[s.id]=parcelMetadata[s.id]}localStorage.setItem(DEMO_STORAGE_KEY,JSON.stringify({shipments,names,metadata}));return true}catch(e){console.warn('Demo storage full or unavailable',e);return false}}
restoreDemoShipments();
function saveDraftShipment(){let codes=draftParcels.map(p=>p.external.trim()).filter(Boolean);if(new Set(codes.map(x=>x.toLowerCase())).size!==codes.length){draftError=T('Chaque code externe doit être unique dans cette expédition.','Each external code must be unique within this shipment.');go('create');return}const id='LGF-DEMO-'+String(shipmentData.length+1).padStart(4,'0'),names=draftParcels.map(p=>[p.name,p.name]);const s={id,...draftParty,count:draftParcels.length,status:'preparing',codes:draftParcels.map((p,i)=>p.external.trim()||'DEMO-'+String(shipmentData.length+1).padStart(4,'0')+'-'+String(i+1).padStart(3,'0'))};shipmentData.push(s);parcelNames[id]=names;parcelMetadata[id]=draftParcels.map(p=>({external:p.external.trim(),photo:p.photo}));selectedShipment=id;const saved=persistDemoShipments();resetDraft();go('shipment');if(!saved)alert(T('Stockage local indisponible : cette expédition peut disparaître après actualisation.','Local storage unavailable: this shipment may disappear after refresh.'))}
let receivingSelection='',receivingCode='';
const DEMO_RECEIVED_KEY='logiflow-demo-received-v1';
function receivedCodes(){try{return JSON.parse(localStorage.getItem(DEMO_RECEIVED_KEY)||'{}')}catch(e){return {}}}
function saveReceivedCodes(v){try{localStorage.setItem(DEMO_RECEIVED_KEY,JSON.stringify(v));return true}catch(e){return false}}
function receiveShipment(id){receivingSelection=id;receivingCode='';go('receiving')}
function receiveByCode(){const s=shipmentData.find(x=>x.id===receivingSelection);if(!s)return;const entered=document.getElementById('receive-code')?.value.trim();if(!entered)return;const idx=s.codes.findIndex((code,i)=>code.toLowerCase()===entered.toLowerCase()||(s.id+'-P'+String(i+1).padStart(3,'0')).toLowerCase()===entered.toLowerCase());const result=document.getElementById('receive-result');if(idx<0){result.textContent=T('Identifiant non reconnu pour cette expédition.','Identifier not found in this shipment.');return}const state=receivedCodes();state[s.id] ||= [];if(state[s.id].includes(idx)){result.textContent=T('Ce colis a déjà été reçu.','This parcel has already been received.');return}state[s.id].push(idx);if(!saveReceivedCodes(state)){result.textContent=T('Impossible d’enregistrer la réception dans ce navigateur.','Unable to save receiving status in this browser.');return}render()}
async function scanReceivingCamera(){if(!navigator.mediaDevices?.getUserMedia||!('BarcodeDetector' in window)){alert(T('Scanner caméra indisponible. Saisissez le code manuellement.','Camera scanning unavailable. Enter the code manually.'));return}let detector;try{detector=new BarcodeDetector({formats:['qr_code','code_128','ean_13','ean_8','upc_a','upc_e','code_39']})}catch(e){alert(T('Scanner non pris en charge.','Scanner unsupported.'));return}stopParcelCamera();const modal=document.createElement('div');modal.id='parcel-camera';modal.style='position:fixed;inset:0;background:#000d;z-index:1000;display:grid;place-items:center;padding:16px';modal.innerHTML='<div style="background:white;padding:16px;border-radius:14px;width:min(100%,480px)"><h3>'+T('Scanner le colis à recevoir','Scan parcel for receiving')+'</h3><video id="parcel-video" autoplay muted playsinline style="width:100%;background:#222"></video><button id="close-parcel-camera">'+T('Annuler','Cancel')+'</button></div>';document.body.appendChild(modal);document.getElementById('close-parcel-camera').onclick=stopParcelCamera;try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(!document.getElementById('parcel-camera')){stream.getTracks().forEach(t=>t.stop());return}activeCameraStream=stream;const video=document.getElementById('parcel-video');video.srcObject=stream;await video.play();let busy=false;activeCameraTimer=setInterval(async()=>{if(busy||!activeCameraStream||video.readyState<2)return;busy=true;try{const codes=await detector.detect(video);if(codes.length&&codes[0].rawValue){const input=document.getElementById('receive-code');if(input){input.value=codes[0].rawValue;stopParcelCamera();receiveByCode()}}}catch(e){console.warn('Receiving scan failed',e)}finally{busy=false}},350)}catch(e){stopParcelCamera();alert(T('Caméra indisponible ou accès refusé.','Camera unavailable or permission denied.'))}}
const DEMO_LOADED_KEY='logiflow-demo-loaded-v1';
function loadedCodes(){try{return JSON.parse(localStorage.getItem(DEMO_LOADED_KEY)||'{}')}catch(e){return {}}}
function saveLoadedCodes(v){try{localStorage.setItem(DEMO_LOADED_KEY,JSON.stringify(v));return true}catch(e){return false}}
function loadShipment(id){receivingSelection=id;go('loading')}
function confirmLoading(){const s=shipmentData.find(x=>x.id===receivingSelection);if(!s)return;if(!plannedTrips()[s.id]){alert(T('Créez un trajet avant le chargement.','Create a trip before loading.'));return}const code=document.getElementById('load-code')?.value.trim().toLowerCase();const i=s.codes.findIndex((v,n)=>v.toLowerCase()===code||(s.id+'-P'+String(n+1).padStart(3,'0')).toLowerCase()===code);const msg=document.getElementById('load-result');if(i<0){msg.textContent=T('Code non reconnu.','Unknown code.');return}if(!(receivedCodes()[s.id]||[]).includes(i)){msg.textContent=T('Réception requise avant chargement.','Parcel must be received before loading.');return}const state=loadedCodes();state[s.id] ||= [];if(state[s.id].includes(i)){msg.textContent=T('Déjà chargé.','Already loaded.');return}state[s.id].push(i);if(!saveLoadedCodes(state)){msg.textContent=T('Enregistrement local impossible.','Unable to save locally.');return}render()}
const planKey='logiflow-demo-plans-v1';
function plannedTrips(){try{return JSON.parse(localStorage.getItem(planKey)||'{}')}catch{return {}}}
function createDemoTrip(){const s=shipmentData.find(x=>x.id===receivingSelection);if(!s)return;const received=receivedCodes()[s.id]||[];if(received.length!==s.count){alert(T('Réception complète requise.','Receive all parcels before planning.'));return}const driver=(document.getElementById('plan-driver')?.value||'').trim(),vehicle=(document.getElementById('plan-vehicle')?.value||'').trim(),type=document.getElementById('plan-type')?.value||'motorbike',capacity=Number(document.getElementById('plan-capacity')?.value),photo=(document.getElementById('plan-photo')?.value||'').trim(),vehiclePhoto=(document.getElementById('plan-vehicle-photo')?.value||'').trim();if(!driver||!vehicle||!Number.isSafeInteger(capacity)||capacity<1){alert(T('Saisissez conducteur, véhicule et capacité valide.','Enter driver, vehicle and valid capacity.'));return}if(capacity<s.count){alert(T('Capacité insuffisante pour les colis du trajet.','Vehicle parcel capacity is too small for this trip.'));return}const plans=plannedTrips();const busy=Object.entries(plans).find(([id,p])=>id!==s.id&&!startedTrips()[id]?.completedAt&&(p.driver.toLowerCase()===driver.toLowerCase()||p.vehicle.toLowerCase()===vehicle.toLowerCase()));if(busy){alert(T('Conducteur ou véhicule déjà affecté.','Driver or vehicle already assigned to an active trip.'));return}plans[s.id]={id:'TRP-'+s.id,driver,vehicle,type,capacity,driverPhoto:photo,vehiclePhoto,createdAt:new Date().toISOString()};try{localStorage.setItem(planKey,JSON.stringify(plans))}catch{alert(T('Enregistrement impossible.','Unable to save trip.'));return}render()}

const tripKey='logiflow-demo-trips-v1';
function startedTrips(){try{return JSON.parse(localStorage.getItem(tripKey)||'{}')}catch{return {}}}
function startDemoTrip(){const shipment=shipmentData.find(x=>x.id===receivingSelection);if(!shipment)return;const loaded=(loadedCodes()[shipment.id]||[]);if(!plannedTrips()[shipment.id]){alert(T('Créez un trajet avant le départ.','Create a trip first.'));return}if(loaded.length!==shipment.count){alert(T('Chargement incomplet.','Loading incomplete.'));return}const trips=startedTrips();trips[shipment.id]={startedAt:new Date().toISOString()};try{localStorage.setItem(tripKey,JSON.stringify(trips))}catch{alert(T('Impossible d’enregistrer le départ.','Unable to save departure.'));return}go('dispatch')}
function createdDispatch(){const trips=startedTrips(),loads=loadedCodes();return shipmentData.filter(s=>s.id.startsWith('LGF-DEMO-')).map(s=>{const loaded=(loads[s.id]||[]).length,started=!!trips[s.id];return `<div class="row"><span><b>${esc(s.id)}</b><br><small>${esc(s.origin)} → ${esc(s.destination)} · ${loaded}/${s.count} ${T('colis chargés','parcels loaded')}</small></span><span>${badge(started?T('En trajet','In transit'):loaded===s.count?T('Prêt au départ','Ready to depart'):T('En préparation','Preparing'),started?'':'warn')} <button onclick="loadShipment('${s.id}')">${T('Voir le manifeste','View manifest')}</button></span></div>`}).join('')}
function loadingDemo(){const s=shipmentData.find(x=>x.id===receivingSelection);if(!s)return '';const rec=receivedCodes()[s.id]||[],loaded=loadedCodes()[s.id]||[],plan=plannedTrips()[s.id];return `<h1>${T('Chargement des colis','Parcel loading')}</h1><p class="sub">${esc(s.id)} · ${plan?esc(plan.id+' · '+plan.driver+' · '+plan.vehicle):T('Aucun trajet créé','No trip created')}</p><div class="cards"><div class="card">${T('Reçus','Received')}<strong>${rec.length}/${s.count}</strong></div><div class="card">${T('Chargés','Loaded')}<strong>${loaded.length}/${s.count}</strong></div></div><div class="panel">${!plan?`<p>${T("Create a trip in Trips & Routes first.","Create a trip in Trips & Routes first.")}</p><button class="primary" onclick="go('trips')">${T("Ouvrir les trajets","Open Trips & Routes")}</button>`:`<p><b>${esc(plan.driver)}</b> · ${esc(plan.vehicle)} · ${esc(plan.type||"")} · ${plan.capacity} ${T("colis max.","parcel max.")}</p>`}<label>${T('Code colis','Parcel code')}<br><input id="load-code" placeholder="${esc(s.id+'-P001')}" ${plan?'':'disabled'} onkeydown="if(event.key==='Enter')confirmLoading()"></label><button class="primary" ${plan?'':'disabled'} onclick="confirmLoading()">${T('Confirmer le chargement','Confirm loading')}</button><p id="load-result" role="status"></p>${s.codes.map((code,i)=>`<div class="row"><span>${esc(s.id+'-P'+String(i+1).padStart(3,'0'))}<br><small>${esc(parcelName(s,i))}</small></span>${badge(loaded.includes(i)?T('Chargé','Loaded'):rec.includes(i)?T('À charger','Ready to load'):T('Non reçu','Not received'),loaded.includes(i)?'': 'warn')}</div>`).join('')}<div class="notice">${loaded.length===s.count?T('Tous les colis sont chargés. Départ prêt pour simulation.','All parcels loaded. Ready for simulated departure.'):T('Le départ est bloqué jusqu’au chargement de tous les colis.','Departure blocked until all parcels are loaded.')}</div><button class="primary" ${plan&&loaded.length===s.count?'':'disabled'} onclick="startDemoTrip()">${T('Démarrer le trajet','Start trip')}</button></div>`}
function tripsWorkspace(){const plans=plannedTrips(),rec=receivedCodes();const options=shipmentData.filter(v=>v.id.startsWith('LGF-DEMO-')&&(rec[v.id]||[]).length===v.count);const selected=shipmentData.find(v=>v.id===receivingSelection);return `<h1>${T('Trajets et itinéraires','Trips & Routes')}</h1><p class="sub">${T('Planification centralisée des trajets; les colis doivent être reçus avant affectation.','Central trip planning; parcels must be received before assignment.')}</p><div class="panel"><h3>${T('Expéditions prêtes à planifier','Shipments ready to plan')}</h3>${options.map(v=>`<div class="row"><span><b>${esc(v.id)}</b><br><small>${esc(v.destination)} · ${v.count} parcels</small></span><button onclick="receivingSelection='${v.id}';render()">${T('Sélectionner','Select')}</button></div>`).join('')||'<p>No fully received demo shipments yet.</p>'}</div>${selected&&!plans[selected.id]&&options.some(v=>v.id===selected.id)?`<div class="panel"><h3>${T('Créer un trajet','Create trip')} · ${esc(selected.id)}</h3><p>${T('Créez un trajet et affectez un conducteur et un véhicule avant le chargement.','Create a trip and assign a driver and vehicle before loading.')}</p><div style="display:grid;gap:10px"><label>${T('Conducteur','Driver')}<input id="plan-driver" placeholder="Driver name"></label><label>${T('Photo du conducteur (URL de démonstration)','Driver photo (demo URL)')}<input id="plan-photo" placeholder="https://..."></label><label>${T('Véhicule / immatriculation','Vehicle / registration')}<input id="plan-vehicle" placeholder="ABC-123"></label><label>${T('Type de véhicule','Vehicle type')}<select id="plan-type"><option value="motorbike">Motorbike / Moto</option><option value="car">Car / Voiture</option><option value="van">Van / Fourgon</option><option value="truck">Truck / Camion</option></select></label><label>${T('Capacité maximale (colis)','Maximum capacity (parcels)')}<input id="plan-capacity" type="number" min="1" value="1"></label><label>${T('Photo du véhicule (URL de démonstration)','Vehicle photo (demo URL)')}<input id="plan-vehicle-photo" placeholder="https://..."></label><button class="primary" onclick="createDemoTrip()">${T('Créer le trajet','Create trip')}</button><small>${T('Capacité par nombre de colis uniquement dans cette démonstration; poids et volume seront ajoutés.','This demo checks parcel count only; weight and volume limits are not implemented yet.')}</small></div></div>`:''}<div class="panel"><h3>${T('Trajets créés','Created trips')}</h3>${Object.entries(plans).map(([id,p])=>`<div class="row"><span><b>${esc(p.id)}</b><br>${esc(p.driver)} · ${esc(p.vehicle)} · ${esc(p.type||'')}<br><small>${esc(id)}</small></span><button onclick="receivingSelection='${id}';go('loading')">${T('Charger','Load')}</button></div>`).join('')||'<p>No trips created yet.</p>'}</div>`}
const fleetKey='logiflow-demo-fleet-v1';function fleetData(){try{const d=JSON.parse(localStorage.getItem(fleetKey)||'{}');return {drivers:d.drivers||[],vehicles:d.vehicles||[]}}catch{return {drivers:[],vehicles:[]}}}function saveFleet(d){localStorage.setItem(fleetKey,JSON.stringify(d))}function fleetEligible(v){const today=new Date().toISOString().slice(0,10);return v.approved===true&&v.licenceExpiry>=today&&v.roadworthyExpiry>=today&&v.condition!=='broken'}function addFleetDriver(){const name=document.getElementById('fleet-driver-name').value.trim(),phone=document.getElementById('fleet-driver-phone').value.trim();const licence=document.getElementById('fleet-driver-licence')?.value.trim()||'',licenceExpiry=document.getElementById('fleet-driver-expiry')?.value||'',email=document.getElementById('fleet-driver-email')?.value.trim()||'',area=document.getElementById('fleet-driver-area')?.value.trim()||'',photo=document.getElementById('fleet-driver-photo')?.value.trim()||'';if(!name||!phone||!licence||!licenceExpiry)return alert('Name, phone, licence and expiry are required');const d=fleetData();d.drivers.push({id:'DRV-'+Date.now(),name,phone,licence,licenceExpiry,email,area,photo,available:false});saveFleet(d);render()}function addFleetVehicle(){const reg=document.getElementById('fleet-reg').value.trim().toUpperCase(),type=document.getElementById('fleet-type').value,capacity=Number(document.getElementById('fleet-capacity').value),licenceExpiry=document.getElementById('fleet-licence').value,roadworthyExpiry=document.getElementById('fleet-roadworthy').value,driverId=document.getElementById('fleet-driver-select').value;if(!reg||!driverId||!Number.isSafeInteger(capacity)||capacity<1||!licenceExpiry||!roadworthyExpiry)return alert('Complete all vehicle and compliance fields');const d=fleetData();if(d.vehicles.some(v=>v.reg===reg))return alert('Vehicle already registered');d.vehicles.push({id:'VEH-'+Date.now(),reg,type,capacity,licenceExpiry,roadworthyExpiry,driverId,make:document.getElementById('fleet-make')?.value.trim()||'',model:document.getElementById('fleet-model')?.value.trim()||'',year:document.getElementById('fleet-year')?.value||'',photo:document.getElementById('fleet-vehicle-photo')?.value.trim()||'',approved:false,condition:'working'});saveFleet(d);render()}function approveFleetVehicle(id){const d=fleetData(),v=d.vehicles.find(v=>v.id===id);if(!v)return;v.approved=true;saveFleet(d);render()}function toggleDriverAvailability(id){const d=fleetData(),driver=d.drivers.find(v=>v.id===id);if(!driver)return;const plans=plannedTrips(),busy=Object.values(plans).some(p=>p.driver===driver.name);if(busy)return alert('Driver assigned to a trip');if(!driver.available&&!d.vehicles.some(v=>v.driverId===id&&fleetEligible(v)))return alert('No approved vehicle with valid licence disc and roadworthy certificate');driver.available=!driver.available;saveFleet(d);render()}let fleetTab='overview',fleetForm='';function fleetNavigate(tab){fleetTab=tab;fleetForm='';render()}function fleetShowForm(type){fleetForm=type;render()}function fleetRemove(type,id){if(!confirm('Delete this demo '+type+'?'))return;const d=fleetData();if(type==='driver'){if(d.vehicles.some(v=>v.driverId===id))return alert('Remove linked vehicles first');d.drivers=d.drivers.filter(v=>v.id!==id)}else d.vehicles=d.vehicles.filter(v=>v.id!==id);saveFleet(d);render()}function fleetEdit(type,id){const d=fleetData(),v=(type==='driver'?d.drivers:d.vehicles).find(x=>x.id===id);if(!v)return;const field=type==='driver'?'name':'capacity',value=prompt('Update '+field,v[field]);if(value===null)return;if(type==='driver'){if(!value.trim())return alert('Name required');v.name=value.trim()}else{const n=Number(value);if(!Number.isSafeInteger(n)||n<1)return alert('Enter a valid capacity');v.capacity=n}saveFleet(d);render()}function fleetWorkspace(){const d=fleetData(),tabs=[['overview','Overview'],['drivers','Drivers'],['vehicles','Vehicles'],['compliance','Compliance'],['availability','Availability']],valid=d.vehicles.filter(fleetEligible).length,expired=d.vehicles.filter(v=>!fleetEligible(v)).length;const head='<h1>'+T('Gestion de flotte','Fleet management')+'</h1><p class="sub">Manage drivers, vehicles and compliance · browser-only demo</p><div class="fleet-tabs" role="tablist">'+tabs.map(([id,label])=>'<button role="tab" aria-selected="'+(fleetTab===id)+'" class="'+(fleetTab===id?'active':'')+'" onclick="fleetNavigate(\''+id+'\')">'+label+'</button>').join('')+'</div>';const driverForm='<div class="panel fleet-form"><h3>Register driver</h3><p class="sub">Personal information</p><div class="fleet-fields"><label>Full name *<input id="fleet-driver-name" placeholder="Full name"></label><label>Phone *<input id="fleet-driver-phone" type="tel" placeholder="+243 ..."></label><label>Email<input id="fleet-driver-email" type="email"></label><label>Operating zone<input id="fleet-driver-area" placeholder="e.g. Gombe"></label></div><p class="sub">Driver documents</p><div class="fleet-fields"><label>Licence number *<input id="fleet-driver-licence"></label><label>Licence expiry *<input id="fleet-driver-expiry" type="date"></label><label>Driver photo URL (demo)<input id="fleet-driver-photo" type="url"></label></div><p class="tiny">Photo URL is temporary; camera upload and verification are pending.</p><div class="actions"><button class="primary" onclick="addFleetDriver()">Save driver</button><button onclick="fleetShowForm(\'\')">Cancel</button></div></div>';const vehicleForm='<div class="panel fleet-form"><h3>Register vehicle</h3><p class="sub">Vehicle details</p><div class="fleet-fields"><label>Registration *<input id="fleet-reg"></label><label>Type *<select id="fleet-type"><option value="motorbike">Motorbike</option><option value="car">Car</option><option value="van">Van</option><option value="truck">Truck</option></select></label><label>Make<input id="fleet-make"></label><label>Model<input id="fleet-model"></label><label>Year<input id="fleet-year" type="number" min="1980" max="2100"></label><label>Parcel capacity *<input id="fleet-capacity" type="number" min="1" value="1"></label><label>Assigned driver *<select id="fleet-driver-select">'+d.drivers.map(v=>'<option value="'+esc(v.id)+'">'+esc(v.name)+'</option>').join('')+'</select></label><label>Vehicle photo URL (demo)<input id="fleet-vehicle-photo" type="url"></label></div><p class="sub">Compliance</p><div class="fleet-fields"><label>Licence disc expiry *<input id="fleet-licence" type="date"></label><label>Roadworthy expiry *<input id="fleet-roadworthy" type="date"></label></div><p class="tiny">Approval remains simulated until authenticated admin review exists.</p><div class="actions"><button class="primary" onclick="addFleetVehicle()">Save vehicle</button><button onclick="fleetShowForm(\'\')">Cancel</button></div></div>';const driverRows=d.drivers.map(v=>'<div class="row"><span><b>'+esc(v.name)+'</b><br>'+esc(v.phone)+' · '+(v.available?'Available':'Offline')+'</span><span class="actions"><button onclick="fleetEdit(\'driver\',\''+v.id+'\')">Edit</button><button onclick="fleetRemove(\'driver\',\''+v.id+'\')">Delete</button></span></div>').join('')||'<p>No drivers registered.</p>';const vehicleRows=d.vehicles.map(v=>'<div class="row"><span><b>'+esc(v.reg)+'</b> · '+esc(v.type)+' · '+v.capacity+' parcels<br><small>Licence: '+esc(v.licenceExpiry)+' · Roadworthy: '+esc(v.roadworthyExpiry)+'</small><br>'+(fleetEligible(v)?'Eligible':v.approved?'Expired / unavailable':'Pending approval')+'</span><span class="actions"><button onclick="fleetEdit(\'vehicle\',\''+v.id+'\')">Edit</button><button onclick="fleetRemove(\'vehicle\',\''+v.id+'\')">Delete</button></span></div>').join('')||'<p>No vehicles registered.</p>';let body='';if(fleetTab==='overview')body='<div class="cards"><div class="card">Drivers<strong>'+d.drivers.length+'</strong></div><div class="card">Vehicles<strong>'+d.vehicles.length+'</strong></div><div class="card">Eligible vehicles<strong>'+valid+'</strong></div><div class="card">Needs attention<strong>'+expired+'</strong></div></div><div class="panel"><h3>Quick actions</h3><div class="actions"><button onclick="fleetNavigate(\'drivers\')">Manage drivers</button><button onclick="fleetNavigate(\'vehicles\')">Manage vehicles</button><button onclick="fleetNavigate(\'compliance\')">Review compliance</button></div></div>';if(fleetTab==='drivers')body='<div class="panel"><div class="row"><h3>Drivers ('+d.drivers.length+')</h3><button class="primary" onclick="fleetShowForm(\'driver\')">+ Add driver</button></div>'+driverRows+'</div>'+(fleetForm==='driver'?driverForm:'');if(fleetTab==='vehicles')body='<div class="panel"><div class="row"><h3>Vehicles ('+d.vehicles.length+')</h3><button class="primary" onclick="fleetShowForm(\'vehicle\')">+ Add vehicle</button></div>'+vehicleRows+'</div>'+(fleetForm==='vehicle'?vehicleForm:'');if(fleetTab==='compliance')body='<div class="panel"><h3>Compliance review</h3>'+d.vehicles.map(v=>'<div class="row"><span><b>'+esc(v.reg)+'</b><br>Licence disc: '+esc(v.licenceExpiry)+'<br>Roadworthy: '+esc(v.roadworthyExpiry)+'<br>'+(fleetEligible(v)?'Eligible':v.approved?'Expired / unavailable':'Pending approval')+'</span>'+(!v.approved?'<button onclick="approveFleetVehicle(\''+v.id+'\')">Demo approve</button>':'')+'</div>').join('')+'</div><p class="tiny">Demo approval is not authenticated. Real proof upload and admin review are pending.</p>';if(fleetTab==='availability')body='<div class="panel"><h3>Driver availability</h3>'+d.drivers.map(v=>'<div class="row"><span><b>'+esc(v.name)+'</b><br>'+(v.available?'Available':'Offline')+'</span><button onclick="toggleDriverAvailability(\''+v.id+'\')">'+(v.available?'Go offline':'Go available')+'</button></div>').join('')+'</div>';return head+body}
function receivingDemo(){const s=shipmentData.find(x=>x.id===receivingSelection);if(!s)return '';const confirmed=receivedCodes()[s.id]||[];return `<h1>${T('Réception des colis','Parcel receiving')}</h1><button onclick="go('shipment')">← ${T('Retour à l’expédition','Back to shipment')}</button><p class="sub">${esc(s.id)} · ${esc(s.origin)} → ${esc(s.destination)}</p><div class="cards"><div class="card">${T('Reçus','Received')}<strong>${confirmed.length}/${s.count}</strong></div><div class="card">${T('En attente','Outstanding')}<strong>${s.count-confirmed.length}</strong></div></div><div class="panel"><h3>${T('Scanner ou saisir un identifiant','Scan or enter an identifier')}</h3><p class="tiny">${T('Entrez le code externe ou le code LogiFlow du colis. Réception simulée, enregistrée dans ce navigateur.','Enter the external code or LogiFlow parcel code. Simulated receiving is saved in this browser.')}</p><input id="receive-code" style="width:100%;max-width:430px" placeholder="LGF-DEMO-0005-P001" onkeydown="if(event.key==='Enter')receiveByCode()"><button class="primary" onclick="receiveByCode()">${T('Confirmer la réception','Confirm receiving')}</button><button onclick="scanReceivingCamera()">${T('Scanner avec caméra','Scan with camera')}</button><p id="receive-result" role="status"></p></div><div class="panel"><h3>${T('Manifeste','Manifest')}</h3>${s.codes.map((code,i)=>`<div class="row"><span><b>${esc(s.id+'-P'+String(i+1).padStart(3,'0'))}</b><br>${esc(parcelName(s,i))}<br><small>${esc(code)}</small></span>${badge(confirmed.includes(i)?T('Reçu','Received'):T('En attente','Outstanding'),confirmed.includes(i)?'':'warn')}</div>`).join('')}</div>`}
function registry(){let q=shipmentQuery.trim().toLowerCase();let rows=shipmentData.filter(s=>[s.id,s.sender,s.recipient,s.origin,s.destination,...s.codes].join(' ').toLowerCase().includes(q));return `<h1>${T('Registre des expéditions','Shipment registry')}</h1><p class="sub">${T('Données fictives · recherchez par référence, expéditeur, destinataire ou code colis','Fictional data · search by reference, sender, recipient or parcel barcode')}</p><div class="actions"><button class="primary" onclick="go('create')">+ ${T('Créer une expédition','Create shipment')}</button></div><div class="panel"><label for="shipment-search">${T('Rechercher','Search')}</label><p><input id="shipment-search" style="width:100%;max-width:520px" value="${esc(shipmentQuery)}" placeholder="${T('Nom, référence ou code','Name, reference or code')}" oninput="shipmentQuery=this.value;document.getElementById('registry-results').innerHTML=registryRows()"></p><div id="registry-results">${registryRows()}</div></div>`}

if(page==='customer')h=`<h1>${T('Suivi public de livraison','Public delivery tracking')}</h1><p class="sub">LGF-2026-00125 · ${T('Lien sécurisé simulé · sans compte','Simulated secure link · no account')}</p><div class="grid"><div class="panel"><h3>${T('Votre livraison','Your delivery')}</h3>${badge(delivered?T('Livré','Delivered'):tripStarted?T('En cours de livraison','Out for delivery'):T('En préparation','Preparing'))}<h2>${delivered?T('Livraison terminée','Delivery complete'):T('Votre livraison est l’arrêt 5 sur 5','Your delivery is stop 5 of 5')}</h2><p>${T('Arrêts restants avant vous','Stops remaining before yours')}: <b>${delivered?0:Math.max(0,5-stop)}</b></p><div class="progress"><div style="width:${delivered?100:(stop-1)*25}%"></div></div><p>${T('Heure estimée (simulation)','Estimated arrival (demo)')}: 14:30–15:00</p><p class="tiny">${T('Localisation fictive; aucune donnée GPS en direct.','Illustrative location; no live GPS data.')}</p><div class="actions"><button onclick="stop=Math.min(5,stop+1);tripStarted=true;render()">${T('Simuler l’arrêt suivant','Simulate next stop')}</button><button onclick="go('delivery')">${T('Confirmer livraison','Confirm delivery')}</button></div></div><div class="panel"><h3>${stop>=4?T('Chauffeur à proximité','Driver approaching'):T('Progression des arrêts','Stop progress')}</h3>${stop>=4?map():`<div class="notice">${T('La carte de proximité s’affichera à l’approche du chauffeur.','The proximity map appears when the driver approaches.')}</div>`}<p class="tiny">${T('Aucune adresse ou information sur les autres clients n’est affichée.','Other customers’ addresses and details are hidden.')}</p></div></div>`;
if(page==='delivery')h=`<h1>${T('Preuve de livraison','Proof of delivery')}</h1><div class="panel"><p>${T('Confirmer les colis réellement remis. Le PIN ne valide pas les colis manquants.','Confirm parcels physically handed over. PIN does not validate missing parcels.')}</p><label>${T('Nombre de colis remis','Parcels handed over')}: <select id="qty">${[1,2,3,4,5].map(i=>`<option ${i===4?'selected':''}>${i}</option>`).join('')}</select></label><p><input id="dpin" placeholder="PIN (demo: 2468)" type="password" autocomplete="off"></p><p><label><input type="checkbox" id="proof"> ${T('Preuve de remise recueillie (signature/photo simulée)','Handover evidence captured (simulated signature/photo)')}</label></p><button class="primary" onclick="if(document.getElementById('dpin').value!=='2468'||!document.getElementById('proof').checked){pinError='${T('PIN valide et preuve requis.','Valid PIN and evidence required.')}';render();return}const q=+document.getElementById('qty').value;if(q<5){alert('${T('Livraison partielle enregistrée; les autres colis restent ouverts.','Partial delivery recorded; remaining parcels stay open.')}')}else{delivered=true}pinError='';go('customer')">${T('Vérifier et enregistrer','Verify and record')}</button>${pinError?`<p class="tag danger">${pinError}</p>`:''}<p class="tiny">${T('Démo uniquement : PIN 2468. Aucune validation serveur ni notification réelle.','Demo only: PIN 2468. No server validation or real notifications.')}</p></div>`;document.getElementById('app').innerHTML=h}render();</script></body></html>
