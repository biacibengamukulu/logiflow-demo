<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LogiFlow · Prototype interactif</title><style>:root{font-family:Inter,system-ui,Arial;background:#f4f7fb;color:#172b43}*{box-sizing:border-box}body{margin:0}header{background:#102c46;color:white;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:23px}button,select,input{font:inherit}button{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;background:#e8eef5;color:#16314b}button.primary{background:#17b8a6;color:#062e32;font-weight:700}button:hover{filter:brightness(.95)}.layout{display:flex;min-height:calc(100vh - 68px)}nav{width:230px;background:#fff;border-right:1px solid #e0e6ee;padding:15px;flex-shrink:0}nav button{display:block;width:100%;text-align:left;background:transparent;margin-bottom:5px}nav button.active{background:#dff6f2;color:#07675c;font-weight:700}main{padding:25px;max-width:1200px;width:100%;margin:auto}.sub{color:#687a8e}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin:20px 0}.card,.panel{background:white;border:1px solid #e1e9f0;border-radius:14px;padding:18px;box-shadow:0 3px 13px #132c4208}.card strong{display:block;font-size:28px;margin:8px 0}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #edf0f3;padding:12px 0}.row:last-child{border:0}.tag{border-radius:30px;background:#e9f7f2;color:#11715f;padding:5px 10px;font-size:12px}.warn{background:#fff2dc;color:#9b5b00}.danger{background:#ffebeb;color:#a62e37}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}input,select{padding:10px;border:1px solid #cbd7e2;border-radius:8px;max-width:100%}.map{height:270px;border-radius:12px;background:linear-gradient(125deg,#e0ece7,#eaf3e9);position:relative;overflow:hidden;border:1px solid #cddfd8}.road{position:absolute;height:12px;background:#fff;transform:rotate(-20deg);width:130%;top:40%;left:-10%;box-shadow:0 80px 0 #fff,0 -75px 0 #fff}.road.two{transform:rotate(53deg);top:45%;left:-15%}.pin{position:absolute;background:#173d59;color:white;border:3px solid white;border-radius:50%;width:33px;height:33px;display:grid;place-items:center;font-size:12px;font-weight:bold;box-shadow:0 3px 9px #0003}.timeline{border-left:3px solid #1ab7a6;margin:15px 0 15px 10px;padding-left:20px}.timeline div{padding:10px 0}.notice{background:#edf9f7;border-left:4px solid #1ab7a6;padding:12px;margin:15px 0;border-radius:5px}.tiny{font-size:12px;color:#6c7c8c}.progress{background:#dce6ec;border-radius:12px;height:11px;overflow:hidden}.progress div{background:#1ab7a6;height:100%}@media(max-width:750px){.layout{display:block}nav{width:100%;display:flex;overflow-x:auto;padding:8px}nav button{min-width:145px;font-size:12px}main{padding:14px}.grid{grid-template-columns:1fr}header{padding:13px}header b{font-size:19px}}</style></head><body><header><div><b>◈ LogiFlow</b> <small> · Kinshasa · DEMO</small></div><button onclick="toggleLang()" id="lang">EN</button></header><div class="layout"><nav id="nav"></nav><main id="app"></main></div><script>
let lang='fr',page='dashboard',received=4,approved=false,loaded=false,tripStarted=false,stop=1,delivered=false,pinError='',collection=false;const T=(fr,en)=>lang==='fr'?fr:en;const pages=[['dashboard','Tableau de bord','Dashboard'],['shipment','Expéditions','Shipments'],['receiving','Réception entrepôt','Warehouse receiving'],['planning','Planification des trajets','Route planning'],['dispatch','Opérations en direct','Live operations'],['ai','Exceptions & IA','Exceptions & AI'],['collection','Collecte & preuve','Collection & proof'],['customer','Suivi client','Customer tracking'],['delivery','Preuve de livraison','Proof of delivery']];function nav(){document.getElementById('nav').innerHTML=pages.map(([id,fr,en])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${T(fr,en)}</button>`).join('')}function go(p){page=p;render()}function toggleLang(){lang=lang==='fr'?'en':'fr';document.getElementById('lang').textContent=lang==='fr'?'EN':'FR';render()}function badge(s,c=''){return `<span class="tag ${c}">${s}</span>`}function map(){return `<div class="map"><div class="road"></div><div class="road two"></div>${[[16,30,'1'],[39,63,'2'],[63,27,'3'],[79,70,'4'],[87,38,'5']].map(([x,y,n])=>`<div class="pin" style="left:${x}%;top:${y}%;background:${+n<stop?'#17b8a6':+n===stop?'#e88a3d':'#173d59'}">${n}</div>`).join('')}</div><div class="tiny">${T('Carte schématique de démonstration — pas de GPS réel','Schematic demo map — no real GPS')}</div>`}function render(){nav();let h='';if(page==='dashboard')h=`<h1>${T('Vue du propriétaire','Business owner overview')}</h1><p class="sub">Kinshasa Fashion · Gombe · ${T('Données simulées','Sample data')}</p><div class="cards">${[['128',T('Expéditions actives','Active shipments')],['214',T('Colis en transit','Parcels in transit')],['42',T('Livrés aujourd’hui','Delivered today')],['18',T('À affecter','Awaiting assignment')],['7',T('En retard','Delayed')],['3',T('Exceptions','Exceptions')]].map(x=>`<div class="card"><span>${x[1]}</span><strong>${x[0]}</strong></div>`).join('')}</div><div class="grid"><div class="panel"><h3>${T('Expédition à surveiller','Shipment requiring attention')}</h3><p>LGF-2026-00125 · 5 ${T('colis','parcels')}</p>${badge(T('4 reçus · 1 manquant','4 received · 1 missing'),'warn')}<div class="actions"><button class="primary" onclick="go('shipment')">${T('Voir l’expédition','View shipment')}</button><button onclick="go('ai')">${T('Voir l’exception','View exception')}</button></div></div><div class="panel"><h3>${T('Actions rapides','Quick actions')}</h3><div class="actions"><button onclick="go('receiving')">${T('Réception','Receiving')}</button><button onclick="go('planning')">${T('Planifier','Plan routes')}</button><button onclick="go('customer')">${T('Suivi public','Public tracking')}</button></div></div></div>`;
if(page==='shipment')h=`<h1>${T('Détails de l’expédition','Shipment details')}</h1><p class="sub">LGF-2026-00125 · Swaly Cargo → Kinshasa → Limete</p><div class="panel"><div class="row"><span><b>${T('Expéditeur','Sender')}</b><br>Kinshasa Fashion · Jean Mbuyi</span><span><b>${T('Destinataire','Recipient')}</b><br>Marie Kabeya</span></div><div class="row"><span><b>${T('Téléphone du destinataire','Recipient phone')}</b><br>+243 000 000 000 (${T('fictif','sample')})</span><span><b>${T('Destination','Destination')}</b><br>Limete, Kinshasa</span></div></div><div class="panel"><h3>${T('Colis et codes externes','Parcels and external barcodes')}</h3>${[1,2,3,4,5].map(i=>`<div class="row"><span><b>LGF-P00${i}</b><br><small>SWC-7845${i} · ${T('Colis','Parcel')} ${i}/5</small><br><small>${T('De','From')}: Kinshasa Fashion · Jean Mbuyi</small><br><small>${T('À','To')}: Marie Kabeya · Limete</small></span>${badge(i<=received?T('Reçu à Limete','Received at Limete'):T('Dernier scan : Kinshasa','Last scan: Kinshasa'),i<=received?'':'warn')}</div>`).join('')}<div class="notice">${T('Les scans confirmés déterminent la garde réelle; le trajet prévu ne la modifie pas.','Confirmed scans determine physical custody; the planned route does not.')}</div><button class="primary" onclick="go('receiving')">${T('Ouvrir le manifeste','Open manifest')}</button></div>`;
if(page==='receiving')h=`<h1>${T('Réception à Limete','Limete warehouse receiving')}</h1><p>TRF-2026-0042 · ${T('Manifeste attendu : 5 colis','Manifest expected: 5 parcels')}</p><div class="panel"><div class="row"><span><b>${T('Expéditeur','Sender')}</b><br>Kinshasa Fashion · Jean Mbuyi</span><span><b>${T('Destinataire','Recipient')}</b><br>Marie Kabeya</span></div><div class="row"><span><b>${T('Origine','Origin')}</b><br>Gombe, Kinshasa</span><span><b>${T('Destination','Destination')}</b><br>Limete, Kinshasa</span></div></div><div class="cards"><div class="card">${T('Reçus','Received')}<strong>${received}/5</strong></div><div class="card">${T('Écarts','Discrepancies')}<strong>${5-received}</strong></div></div><div class="panel">${[1,2,3,4,5].map(i=>`<div class="row"><span><b>LGF-P00${i}</b><br><small>SWC-7845${i}</small><br><small>${T('Expéditeur','Sender')}: Kinshasa Fashion · Jean Mbuyi</small><br><small>${T('Destinataire','Recipient')}: Marie Kabeya</small></span>${badge(i<=received?T('Scan confirmé','Scan confirmed'):T('En attente','Outstanding'),i<=received?'':'warn')}</div>`).join('')}<div class="notice">${T('Un colis en attente ne devient reçu qu’après confirmation de son scan physique. Le bouton ci-dessous simule ce scan pour la démonstration.','An outstanding parcel becomes received only after a confirmed physical scan. The button below simulates that scan for this demo.')}</div><div class="actions"><button class="primary" onclick="received=5;render()">${T('Simuler le scan du 5e colis','Simulate scanning fifth parcel')}</button><button onclick="go('ai')">${T('Traiter l’écart','Review discrepancy')}</button></div></div>`;
if(page==='planning')h=`<h1>${T('Planification des trajets','Dispatcher route planning')}</h1><p class="sub">${T('Scénario : 40 livraisons · 5 chauffeurs · Kinshasa','Scenario: 40 deliveries · 5 drivers · Kinshasa')}</p><div class="grid"><div class="panel"><h3>${T('Carte des arrêts proposés','Suggested stop map')}</h3>${map()}<div class="actions"><button class="primary" onclick="approved=false;document.getElementById('suggest').innerHTML='${T('Suggestions générées : 5 trajets, 40 livraisons.','Suggestions generated: 5 trips, 40 deliveries.')}'">${T('Générer des suggestions','Generate suggestions')}</button></div><div id="suggest" class="notice">${T('Simulation de regroupement géographique et de capacité.','Simulated geographic grouping and capacity.')}</div></div><div class="panel"><h3>${T('Trajets proposés','Proposed trips')}</h3>${[['Jean','Moto',8],['Patrick','Van',10],['Alain','Moto',7],['Michel','Van',9],['Sarah','Moto',6]].map(([n,v,c],i)=>`<div class="row"><span><b>${n}</b><br><small>${v} · ${c} ${T('livraisons','deliveries')}</small></span>${badge(i===0?T('Disponible','Available'):T('À vérifier','Review'))}</div>`).join('')}<div class="actions"><button onclick="document.getElementById('adjust').textContent='${T('Arrêt déplacé vers un autre trajet (simulation).','Stop moved to another trip (simulation).')}'">${T('Réaffecter un arrêt','Reassign a stop')}</button><button class="primary" onclick="approved=true;render()">${T('Approuver les trajets','Approve routes')}</button></div><div id="adjust" class="tiny"></div>${approved?`<div class="notice">${T('Plan approuvé. Chargement physique encore requis.','Plan approved. Physical loading still required.')}</div>`:''}</div></div>`;
if(page==='dispatch')h=`<h1>${T('Opérations en direct','Live dispatch operations')}</h1><div class="grid"><div class="panel"><h3>${T('Chauffeurs','Drivers')}</h3>${[['Jean',T('Disponible','Available')],['Patrick',T('En trajet','On trip')],['Alain',T('Réservé','Reserved')],['Michel',T('Hors ligne','Offline')]].map(x=>`<div class="row">${x[0]} ${badge(x[1])}</div>`).join('')}</div><div class="panel"><h3>TRP-2026-0018 · Patrick</h3><p>${T('8 arrêts · 12 colis','8 stops · 12 parcels')}</p>${badge(tripStarted?T('En cours','In progress'):loaded?T('Chargé','Loaded'):T('À charger','Awaiting loading'),'warn')}<div class="actions"><button onclick="loaded=true;render()">${T('Confirmer scans de chargement','Confirm loading scans')}</button><button class="primary" onclick="if(!approved||!loaded){alert('${T('Approuver le plan et confirmer le chargement d’abord.','Approve plan and confirm loading first.')}')}else{tripStarted=true;render()}">${T('Démarrer le trajet','Start trip')}</button></div><button onclick="go('customer')">${T('Voir le suivi client','View customer tracking')}</button></div></div>`;
if(page==='ai')h=`<h1>${T('Exceptions & recommandations','Exceptions & recommendations')}</h1><div class="panel"><h3>${T('Écart de réception','Receiving discrepancy')}</h3>${badge(received===5?T('Résolu','Resolved'):T('Attention requise','Needs attention'),received===5?'':'danger')}<p>${received}/5 ${T('colis confirmés au dépôt de Limete.','parcels confirmed at Limete warehouse.')}</p><div class="notice">${T('Recommandation : vérifier le dernier scan confirmé du colis LGF-P005 et contacter le dépôt précédent. Ne pas déclarer le colis reçu sans scan.','Recommendation: check the last confirmed scan of LGF-P005 and contact the previous branch. Do not mark it received without a scan.')}</div><button onclick="go('receiving')">${T('Ouvrir la réception','Open receiving')}</button></div>`;
if(page==='collection')h=`<h1>${T('Confirmer la collecte','Confirm collection')}</h1><div class="panel"><p>${T('Scanner les colis, vérifier la remise et enregistrer le personnel autorisé.','Scan parcels, verify handover and record authorized staff.')}</p><label><input type="checkbox" id="scan" checked> ${T('Colis scannés','Parcels scanned')}</label><p><label><input type="checkbox" id="optional"> ${T('PIN de collecte requis par la politique commerciale','Collection PIN required by merchant policy')}</label></p><input id="cpin" placeholder="PIN (demo: 1234)"><div class="actions"><button class="primary" onclick="if(!document.getElementById('scan').checked||document.getElementById('optional').checked&&document.getElementById('cpin').value!=='1234'){alert('${T('Vérification requise','Verification required')}');return}collection=true;render()">${T('Confirmer la collecte','Confirm collection')}</button></div>${collection?`<div class="notice">${T('Collecte enregistrée dans la simulation.','Collection recorded in simulation.')}</div>`:''}</div>`;
if(page==='customer')h=`<h1>${T('Suivi public de livraison','Public delivery tracking')}</h1><p class="sub">LGF-2026-00125 · ${T('Lien sécurisé simulé · sans compte','Simulated secure link · no account')}</p><div class="grid"><div class="panel"><h3>${T('Votre livraison','Your delivery')}</h3>${badge(delivered?T('Livré','Delivered'):tripStarted?T('En cours de livraison','Out for delivery'):T('En préparation','Preparing'))}<h2>${delivered?T('Livraison terminée','Delivery complete'):T('Votre livraison est l’arrêt 5 sur 5','Your delivery is stop 5 of 5')}</h2><p>${T('Arrêts restants avant vous','Stops remaining before yours')}: <b>${delivered?0:Math.max(0,5-stop)}</b></p><div class="progress"><div style="width:${delivered?100:(stop-1)*25}%"></div></div><p>${T('Heure estimée (simulation)','Estimated arrival (demo)')}: 14:30–15:00</p><p class="tiny">${T('Localisation fictive; aucune donnée GPS en direct.','Illustrative location; no live GPS data.')}</p><div class="actions"><button onclick="stop=Math.min(5,stop+1);tripStarted=true;render()">${T('Simuler l’arrêt suivant','Simulate next stop')}</button><button onclick="go('delivery')">${T('Confirmer livraison','Confirm delivery')}</button></div></div><div class="panel"><h3>${stop>=4?T('Chauffeur à proximité','Driver approaching'):T('Progression des arrêts','Stop progress')}</h3>${stop>=4?map():`<div class="notice">${T('La carte de proximité s’affichera à l’approche du chauffeur.','The proximity map appears when the driver approaches.')}</div>`}<p class="tiny">${T('Aucune adresse ou information sur les autres clients n’est affichée.','Other customers’ addresses and details are hidden.')}</p></div></div>`;
if(page==='delivery')h=`<h1>${T('Preuve de livraison','Proof of delivery')}</h1><div class="panel"><p>${T('Confirmer les colis réellement remis. Le PIN ne valide pas les colis manquants.','Confirm parcels physically handed over. PIN does not validate missing parcels.')}</p><label>${T('Nombre de colis remis','Parcels handed over')}: <select id="qty">${[1,2,3,4,5].map(i=>`<option ${i===4?'selected':''}>${i}</option>`).join('')}</select></label><p><input id="dpin" placeholder="PIN (demo: 2468)" type="password" autocomplete="off"></p><p><label><input type="checkbox" id="proof"> ${T('Preuve de remise recueillie (signature/photo simulée)','Handover evidence captured (simulated signature/photo)')}</label></p><button class="primary" onclick="if(document.getElementById('dpin').value!=='2468'||!document.getElementById('proof').checked){pinError='${T('PIN valide et preuve requis.','Valid PIN and evidence required.')}';render();return}const q=+document.getElementById('qty').value;if(q<5){alert('${T('Livraison partielle enregistrée; les autres colis restent ouverts.','Partial delivery recorded; remaining parcels stay open.')}')}else{delivered=true}pinError='';go('customer')">${T('Vérifier et enregistrer','Verify and record')}</button>${pinError?`<p class="tag danger">${pinError}</p>`:''}<p class="tiny">${T('Démo uniquement : PIN 2468. Aucune validation serveur ni notification réelle.','Demo only: PIN 2468. No server validation or real notifications.')}</p></div>`;document.getElementById('app').innerHTML=h}render();</script></body></html>
